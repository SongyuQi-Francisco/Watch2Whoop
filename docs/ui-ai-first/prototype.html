<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 优先 UI 原型</title>
<!-- Clickable prototype for docs/ui-ai-first-redesign.md (issue #279). Synthetic data only; nothing here talks to a server.
     Icons: Lucide (ISC), SVG paths inlined from github.com/lucide-icons/lucide main. -->
<style>
:root {
  --bg: #ffffff; --surface: #f4f4f6; --surface-2: #e9e9ed; --text: #111113; --text-2: #6c6c73; --text-3: #a3a3aa;
  --hair: rgba(0,0,0,.06); --good: #4e9a6b; --mid: #b58a34; --bad: #be5a44; --sleep: #6870c4; --strain: #3d7fd1;
  --ai: #6f6cf0; --ai-soft: rgba(111,108,240,.10); --good-soft: rgba(78,154,107,.12); --mid-soft: rgba(181,138,52,.13);
  --bad-soft: rgba(190,90,68,.12); --sheet: #ffffff; --scrim: rgba(0,0,0,.28); --chrome: rgba(255,255,255,.88);
  --page: #e8e8ec; --radius: 18px; --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000; --surface: #121214; --surface-2: #1d1d20; --text: #f4f4f6; --text-2: #8d8d94; --text-3: #55555b; --hair: rgba(255,255,255,.07);
  --good: #72bf8e; --mid: #d3ae63; --bad: #de7f69; --sleep: #8d93e4; --strain: #6aa7ee; --ai: #a3a6ff; --ai-soft: rgba(163,166,255,.13);
  --good-soft: rgba(114,191,142,.14); --mid-soft: rgba(211,174,99,.14); --bad-soft: rgba(222,127,105,.14); --sheet: #161618;
  --scrim: rgba(0,0,0,.6); --chrome: rgba(0,0,0,.84); --page: #0c0c0e; } }
:root[data-theme="dark"] {
  --bg: #000; --surface: #121214; --surface-2: #1d1d20; --text: #f4f4f6; --text-2: #8d8d94; --text-3: #55555b; --hair: rgba(255,255,255,.07);
  --good: #72bf8e; --mid: #d3ae63; --bad: #de7f69; --sleep: #8d93e4; --strain: #6aa7ee; --ai: #a3a6ff; --ai-soft: rgba(163,166,255,.13);
  --good-soft: rgba(114,191,142,.14); --mid-soft: rgba(211,174,99,.14); --bad-soft: rgba(222,127,105,.14); --sheet: #161618;
  --scrim: rgba(0,0,0,.6); --chrome: rgba(0,0,0,.84); --page: #0c0c0e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

/* ---- page around the phone */
.stage { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 28px 16px; flex-wrap: wrap; }
.ctl { width: 300px; max-width: 100%; }
.ctl h1 { font-size: 20px; margin: 0 0 6px; }
.ctl p { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
.ctl h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 18px 0 8px; }
.ctl .opts { display: flex; flex-direction: column; gap: 6px; }
.ctl .opt { background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.ctl .opt small { display: block; color: var(--text-2); font-size: 12px; }
.ctl .opt[aria-pressed="true"] { outline: 2px solid var(--ai); }
.ctl .row { display: flex; gap: 6px; flex-wrap: wrap; }
.ctl .row .opt { flex: 1; text-align: center; }

.phone { width: 390px; height: 844px; border-radius: 54px; padding: 0; background: var(--bg); position: relative; overflow: hidden;
  box-shadow: 0 0 0 10px #1b1b1e, 0 0 0 11px #3a3a3f, 0 30px 80px rgba(0,0,0,.35); flex: none; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.statusbar { height: 50px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; }
.statusbar .isl { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 20px; }
.statusbar .bat { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; opacity: .8; position: relative; }
.statusbar .bat::after { content: ""; position: absolute; inset: 1.5px 6px 1.5px 1.5px; background: currentColor; border-radius: 1.5px; }
.view { flex: 1; overflow-y: auto; padding: 4px 16px 120px; scrollbar-width: none; scroll-behavior: smooth; }
.view::-webkit-scrollbar { display: none; }

/* ---- header */
.top { display: flex; align-items: flex-end; justify-content: space-between; margin: 6px 0 12px; }
.top .date { color: var(--text-2); font-size: 13px; }
.top h1 { font-size: 30px; margin: 0; letter-spacing: -.01em; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); }

/* ---- AI brief line */
.brief { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border-radius: 14px; background: var(--ai-soft); color: var(--text); margin-bottom: 14px; }
.brief .i { color: var(--ai); }
.brief span { flex: 1; font-weight: 600; font-size: 15px; }
.brief .chev { color: var(--text-3); width: 16px; height: 16px; }

/* ---- the three core dials */
.core { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
.dial { background: var(--surface); border-radius: var(--radius); padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dial svg { width: 86px; height: 86px; }
.dial .track { stroke: var(--surface-2); }
.dial text.v { font-size: 25px; font-weight: 700; fill: var(--text); font-variant-numeric: tabular-nums; }
.dial text.u { font-size: 11px; fill: var(--text-2); }
.dial .cap { font-size: 13px; color: var(--text-2); }
.dial .cap b { color: var(--text); font-weight: 600; }

/* ---- sections */
.sh { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 2px 8px; }
.sh h2 { font-size: 17px; margin: 0; }
.sh small { color: var(--text-2); font-size: 13px; }

/* focus: today's 1–3 things */
.focus { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.fi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; }
.fi + .fi { border-top: 1px solid var(--hair); }
.fi .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.fi .ic .i { width: 18px; height: 18px; }
.fi .t { flex: 1; min-width: 0; }
.fi .t b { display: block; font-weight: 600; font-size: 15px; }
.fi .t small { color: var(--text-2); font-size: 12px; }
.fi .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.fi .chev { color: var(--text-3); width: 16px; height: 16px; }
.fi.done .t b { color: var(--text-2); text-decoration: line-through; }
.tone-good { color: var(--good); } .tone-mid { color: var(--mid); } .tone-bad { color: var(--bad); } .tone-sleep { color: var(--sleep); } .tone-ai { color: var(--ai); } .tone-strain { color: var(--strain); }
.bg-good { background: var(--good-soft) !important; } .bg-mid { background: var(--mid-soft) !important; } .bg-bad { background: var(--bad-soft) !important; } .bg-ai { background: var(--ai-soft) !important; }

/* module cards */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mod { background: var(--surface); border-radius: var(--radius); padding: 12px; min-height: 108px; display: flex; flex-direction: column; gap: 6px; position: relative; text-align: left; }
.mod .mh { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
.mod .mh .i { width: 15px; height: 15px; }
.mod .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.mod .big small { font-size: 13px; color: var(--text-2); font-weight: 500; margin-left: 2px; }
.mod .sub { font-size: 12px; color: var(--text-2); margin-top: auto; }
.mod .chip { position: absolute; top: 10px; right: 10px; font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--ai-soft); color: var(--ai); font-weight: 600; }
.mod.ghost { background: transparent; border: 1.5px dashed var(--text-3); justify-content: center; align-items: center; text-align: center; color: var(--text-2); }
.mod.ghost .i { color: var(--ai); width: 22px; height: 22px; }
.mod.ghost b { color: var(--text); font-size: 14px; }
.mod.wide { grid-column: span 2; min-height: 0; }
.mod.temp { outline: 1.5px solid var(--mid); }
.mod.grow { animation: grow .9s var(--ease) both, glow 2.4s ease-out .5s 1; }
@keyframes grow { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 var(--ai); } 40% { box-shadow: 0 0 0 6px var(--ai-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
.spark { width: 100%; height: 30px; overflow: visible; }
.spark path { fill: none; stroke: currentColor; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.spark .area { fill: currentColor; opacity: .12; stroke: none; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); }
.dots i.on { background: currentColor; }
.foot { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 16px 0 0; color: var(--text-2); font-size: 13px; width: 100%; }
.foot .i { width: 15px; height: 15px; }

/* ---- tab bar + Jarvis key */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 0 12px 26px; display: flex; align-items: center; justify-content: space-around;
  background: var(--chrome); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--hair); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--text-3); width: 62px; }
.tab[aria-current="page"] { color: var(--text); }
.tab .i { width: 23px; height: 23px; }
.tab.grow { animation: grow .8s var(--ease) both; }
.jkey { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; margin-top: -26px; color: #fff;
  background: radial-gradient(circle at 50% 40%, #8a87ff, #4b47d6 70%); box-shadow: 0 0 0 4px var(--bg), 0 0 0 5.5px var(--ai-soft), 0 8px 24px rgba(80,76,220,.45); }
.jkey .i { width: 27px; height: 27px; stroke-width: 1.9; }

/* ---- sheet (Jarvis half sheet, detail sheets) */
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 5; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; min-height: 56%; background: var(--sheet); border-radius: 22px 22px 0 0; z-index: 6;
  transform: translateY(105%); transition: transform .35s var(--ease); display: flex; flex-direction: column; }
.sheet.on { transform: none; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--surface-2); margin: 8px auto 4px; flex: none; }
.sheet .shd { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 8px; flex: none; }
.sheet .shd h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.sheet .shd h3 .i { color: var(--ai); }
.sheet .x { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
.sheet .x .i { width: 16px; height: 16px; }
.sheet .sb { flex: 1; overflow-y: auto; padding: 0 16px 16px; scrollbar-width: none; }

/* chat */
.msgs { display: flex; flex-direction: column; gap: 10px; }
.bub { max-width: 84%; padding: 9px 12px; border-radius: 16px; font-size: 15px; }
.bub.me { align-self: flex-end; background: var(--ai); color: #fff; border-bottom-right-radius: 5px; }
.bub.me .vt { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; opacity: .8; margin-bottom: 2px; }
.bub.me .vt .i { width: 12px; height: 12px; }
.bub.ai { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 5px; }
.ccard { align-self: stretch; background: var(--surface); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ccard .ch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.ccard .ch .i { width: 15px; height: 15px; }
.ccard .ch .ok { margin-left: auto; color: var(--good); display: flex; align-items: center; gap: 3px; font-weight: 600; }
.ccard .ch .ok .i { width: 14px; height: 14px; }
.ccard .row2 { display: flex; align-items: baseline; gap: 14px; }
.ccard .row2 div { display: flex; flex-direction: column; }
.ccard .row2 b { font-size: 20px; font-variant-numeric: tabular-nums; }
.ccard .row2 small { color: var(--text-2); font-size: 12px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
.pill .i { width: 15px; height: 15px; }
.pill.pri { background: var(--ai); color: #fff; }
.pill.on { background: var(--good-soft); color: var(--good); }
.typing { display: flex; gap: 4px; padding: 12px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .3; } }
.compose { display: flex; align-items: center; gap: 8px; padding: 8px 12px 30px; border-top: 1px solid var(--hair); flex: none; }
.compose .in { flex: 1; background: var(--surface); border-radius: 20px; padding: 9px 14px; color: var(--text-3); font-size: 15px; }
.compose .mic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ai); color: #fff; }
.sugg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.sugg button { padding: 7px 11px; border-radius: 99px; border: 1px solid var(--hair); background: var(--surface); font-size: 13px; }

/* detail sheet layers */
.layer { margin-top: 14px; }
.layer h4 { margin: 0 0 6px; font-size: 12px; color: var(--text-2); font-weight: 600; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.layer h4 .lv { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); }
.glance { display: flex; align-items: baseline; gap: 10px; }
.glance .big { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.chart { width: 100%; height: 120px; }
.chart .band { fill: currentColor; opacity: .09; }
.chart .ln { fill: none; stroke: currentColor; stroke-width: 2; vector-effect: non-scaling-stroke; }
.chart .base { stroke: var(--text-3); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.chart text { font-size: 9px; fill: var(--text-3); }
table.raw { width: 100%; border-collapse: collapse; font-size: 13px; }
table.raw th { text-align: left; color: var(--text-2); font-weight: 500; font-size: 12px; padding: 4px 0; }
table.raw td { padding: 6px 0; border-top: 1px solid var(--hair); font-variant-numeric: tabular-nums; }
table.raw td:last-child, table.raw th:last-child { text-align: right; color: var(--text-2); }

/* segmented control, lists */
.seg { display: flex; background: var(--surface); border-radius: 10px; padding: 2px; margin: 0 0 12px; }
.seg button { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; font-size: 13px; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tcard { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; display: block; width: 100%; }
.tcard .th { display: flex; justify-content: space-between; align-items: baseline; }
.tcard .th b { font-size: 15px; }
.tcard .th span { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tcard .th span small { font-size: 12px; color: var(--text-2); font-weight: 500; margin-left: 2px; }
.tcard .delta { font-size: 12px; color: var(--text-2); }
.mini3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini3 .mod { min-height: 84px; }
.locked { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--radius); border: 1.5px dashed var(--surface-2); color: var(--text-2); width: 100%; }
.locked .i { color: var(--text-3); }
.locked b { color: var(--text); display: block; font-size: 14px; }
.locked small { font-size: 12px; }
.prog { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ai); border-radius: 2px; }
.list { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; }
.li + .li { border-top: 1px solid var(--hair); }
.li .i.lead { width: 18px; height: 18px; color: var(--text-2); }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; font-weight: 500; }
.li .t small { color: var(--text-2); font-size: 12px; }
.li .v { color: var(--text-2); font-size: 14px; }
.li .chev { color: var(--text-3); width: 16px; height: 16px; }
.st { font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.st.pinned { background: var(--ai-soft); color: var(--ai); }
.st.open { background: var(--good-soft); color: var(--good); }
.st.ready { background: var(--mid-soft); color: var(--mid); }
.st.locked { background: var(--surface-2); color: var(--text-2); }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--surface-2); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s; }
.switch.on { background: var(--good); }
.switch.on::after { left: 21px; }
.me-head { display: flex; align-items: center; gap: 12px; margin: 8px 0 16px; }
.me-head .avatar { width: 54px; height: 54px; }
.me-head b { font-size: 20px; display: block; }
.me-head small { color: var(--text-2); }
/* timeline */
.tl { position: relative; padding-left: 16px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--surface-2); }
.te { position: relative; margin-bottom: 8px; }
.te::before { content: ""; position: absolute; left: -15px; top: 18px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--bg); }
.te .tcard { margin: 0; display: flex; gap: 10px; align-items: center; }
.te .tm { font-size: 12px; color: var(--text-2); width: 40px; flex: none; font-variant-numeric: tabular-nums; }
.te .src { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 3px; }
.te .src .i { width: 11px; height: 11px; }
.chips { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.chips button { padding: 6px 12px; border-radius: 99px; background: var(--surface); font-size: 13px; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 100px; background: var(--text); color: var(--bg); border-radius: 14px; padding: 11px 14px; font-size: 14px;
  opacity: 0; transform: translateY(10px); transition: all .3s var(--ease); z-index: 9; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
.toast .i { color: var(--ai); width: 18px; height: 18px; }
.why { position: absolute; top: 10px; right: 10px; font-size: 10.5px; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); }
.goalchips { display: flex; flex-wrap: wrap; gap: 6px; }
.goalchips button { padding: 8px 13px; border-radius: 99px; border: 1.5px solid var(--surface-2); font-size: 14px; }
.goalchips button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); font-weight: 600; }
.ccard.find .ft { font-size: 15px; }
.ccard.find .row2 { align-items: center; }
.sheet.tall { min-height: 88%; max-height: 92%; }
.mod.circ { gap: 8px; min-height: 0; }
.crow { display: flex; align-items: center; gap: 10px; }
.avs { display: flex; }
.avs i, .av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-style: normal; font-weight: 600; border: 2px solid var(--surface); flex: none; }
.avs i + i { margin-left: -8px; }
.rk { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-2); }
.rk .i { width: 15px; height: 15px; color: var(--mid); }
.rk b { color: var(--text); }
.post1 { font-size: 13px; color: var(--text-2); }
.post1 b { color: var(--text); font-weight: 600; }
.post .ph { display: flex; align-items: center; gap: 8px; }
.post .ph span { display: flex; flex-direction: column; }
.post .ph small { color: var(--text-2); font-size: 12px; }
.post .pb { margin: 8px 0 6px; font-size: 15px; }
.post .pb b { font-size: 18px; }
.post .pf { display: flex; gap: 14px; color: var(--text-2); font-size: 13px; }
.post .pf span { display: flex; align-items: center; gap: 4px; }
.post .pf .i { width: 15px; height: 15px; }
.tab { position: relative; }
.badge-dot { position: absolute; top: 0; right: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px; padding: 9px 12px; color: var(--text-3); margin-bottom: 12px; }
.search .i { width: 17px; height: 17px; }
.muted { color: var(--text-2); font-weight: 400; font-size: 13px; }
.top .pill { margin-bottom: 6px; }
/* ---- hero: the three core scores as rings, always the first thing on Today */
.hero3 { display: grid; grid-template-columns: 1fr 1.55fr 1fr; align-items: end; gap: 4px; margin: 2px 0 10px; }
.hr { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.hr svg { width: 100%; height: auto; overflow: visible; }
.hr.sm svg { max-width: 104px; } .hr.lg svg { max-width: 176px; }
.ring .track { fill: none; stroke: var(--surface-2); }
.ring .ticks { fill: none; stroke: var(--text-3); stroke-width: 1; opacity: 0; }
.ring .arc { fill: none; stroke-linecap: round; }
.ring.lg .track, .ring.lg .arc { stroke-width: 12; } .ring.sm .track, .ring.sm .arc { stroke-width: 13; }
.ring text { fill: var(--text); font-variant-numeric: tabular-nums; }
.ring .rv { font-weight: 700; } .ring.lg .rv { font-size: 52px; } .ring.sm .rv { font-size: 40px; }
.ring .ru { font-size: 15px; fill: var(--text-2); }
.hr .hl { font-size: 13px; color: var(--text-2); }
.hr .hs { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
.vitals span { background: var(--surface); border-radius: 12px; padding: 7px 8px; display: flex; flex-direction: column; }
.vitals i { font-style: normal; font-size: 10.5px; color: var(--text-2); }
.vitals b { font-size: 17px; font-variant-numeric: tabular-nums; }
.vitals b small { font-size: 10.5px; color: var(--text-2); font-weight: 500; margin-left: 2px; }

/* ---- Jarvis ring menu (same four keys as jarvis-entry.js, #53 / #258) */
.orbit { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; z-index: 4; pointer-events: none; }
.orbit .ob { position: absolute; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--text);
  opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.3); transition: transform .45s var(--ease), opacity .3s; pointer-events: auto; }
.orbit .ob span.k { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--hair); }
.orbit .ob .i { width: 22px; height: 22px; }
.orbit.on .ob { opacity: 1; transform: none; }
.orbit .ob:nth-child(1) { left: 34px; bottom: 112px; --fx: 130px; --fy: 80px; }
.orbit .ob:nth-child(2) { left: 104px; bottom: 182px; --fx: 60px; --fy: 150px; }
.orbit .ob:nth-child(3) { right: 104px; bottom: 182px; --fx: -60px; --fy: 150px; }
.orbit .ob:nth-child(4) { right: 34px; bottom: 112px; --fx: -130px; --fy: 80px; }
.orbit-scrim { position: absolute; inset: 0; z-index: 3; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .3s; }
.orbit-scrim.on { opacity: 1; pointer-events: auto; }
.jkey .i.cd { display: none; } .jkey.open .i.cd { display: block; } .jkey.open .i.ob1 { display: none; }
.jkey { position: relative; z-index: 5; }

/* =====================================================================
   Look A · 星环 HUD: same language as the Jarvis HUD (#258). Near-black with a violet / cyan haze, glass panels with
   hairline borders and corner brackets, gradient rings with a soft glow and a tick bezel, monospace HUD labels.
   ===================================================================== */
:root[data-look="a"] {
  --bg: #04050a; --surface: rgba(140,150,255,.055); --surface-2: rgba(140,150,255,.12); --text: #eef0ff; --text-2: #8d93b8; --text-3: #4c5170;
  --hair: rgba(140,150,255,.16); --good: #34f5b0; --mid: #ffc24a; --bad: #ff6b6b; --sleep: #9a8cff; --strain: #38b8ff; --ai: #a7a4ff;
  --ai-soft: rgba(167,164,255,.12); --good-soft: rgba(52,245,176,.1); --mid-soft: rgba(255,194,74,.12); --bad-soft: rgba(255,107,107,.12);
  --sheet: #0a0b14; --chrome: rgba(5,6,12,.96); --page: #020207; --radius: 16px;
  --g-rec-1: #34f5b0; --g-rec-2: #18c8ff; --g-sl-1: #7a6bff; --g-sl-2: #d08bff; --g-st-1: #38b8ff; --g-st-2: #6f6cff;
}
[data-look="a"] .screen { background: radial-gradient(120% 60% at 50% -10%, rgba(111,108,240,.22), transparent 60%), radial-gradient(80% 40% at 100% 30%, rgba(24,200,255,.07), transparent 70%), var(--bg); }
[data-look="a"] .mod, [data-look="a"] .focus, [data-look="a"] .tcard, [data-look="a"] .list, [data-look="a"] .vitals span, [data-look="a"] .brief, [data-look="a"] .ccard,
[data-look="a"] .bub.ai { border: 1px solid var(--hair); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
[data-look="a"] .mod::before, [data-look="a"] .mod::after { content: ""; position: absolute; width: 9px; height: 9px; border-color: rgba(167,164,255,.55); border-style: solid; pointer-events: none; }
[data-look="a"] .mod::before { top: -1px; left: -1px; border-width: 1.5px 0 0 1.5px; border-top-left-radius: 6px; }
[data-look="a"] .mod::after { bottom: -1px; right: -1px; border-width: 0 1.5px 1.5px 0; border-bottom-right-radius: 6px; }
[data-look="a"] .mod.ghost::before, [data-look="a"] .mod.ghost::after { display: none; }
[data-look="a"] .ring .arc { filter: drop-shadow(0 0 6px var(--glow, rgba(52,245,176,.55))); }
[data-look="a"] .ring .ticks { opacity: .55; }
[data-look="a"] .ring .rv { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; letter-spacing: -.04em; }
[data-look="a"] .ring.lg .rv { font-size: 50px; }
[data-look="a"] .hr .hl, [data-look="a"] .vitals i, [data-look="a"] .sh small, [data-look="a"] .date, [data-look="a"] .mod .mh, [data-look="a"] .tab span, [data-look="a"] .why {
  font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; }
[data-look="a"] .hr .hl::before { content: "◢ "; color: var(--ai); font-size: 9px; }
[data-look="a"] .sh h2 { font-size: 13px; letter-spacing: .14em; color: var(--text-2); font-weight: 600; }
[data-look="a"] .sh h2::before { content: "// "; color: var(--ai); }
[data-look="a"] .big, [data-look="a"] .vitals b, [data-look="a"] .fi .v, [data-look="a"] .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -.03em; }
[data-look="a"] .brief { background: linear-gradient(90deg, rgba(111,108,240,.20), rgba(24,200,255,.08)); }
[data-look="a"] .brief .i { filter: drop-shadow(0 0 6px var(--ai)); }
[data-look="a"] .spark path, [data-look="a"] .meter i { filter: drop-shadow(0 0 4px currentColor); }
[data-look="a"] .spark path { stroke-width: 1.5; }
[data-look="a"] .pill.pri, [data-look="a"] .compose .mic { background: linear-gradient(90deg, #6f6cf0, #18c8ff); box-shadow: 0 0 16px rgba(111,108,240,.45); }
[data-look="a"] .tab[aria-current="page"] { color: #fff; text-shadow: 0 0 10px rgba(167,164,255,.8); }
[data-look="a"] .tabbar { border-top: 1px solid var(--hair); }
[data-look="a"] .jkey { background: radial-gradient(circle at 50% 38%, #b9b6ff, #5a55ea 55%, #241f9e 100%);
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px rgba(167,164,255,.5), 0 0 0 11px rgba(167,164,255,.08), 0 0 28px rgba(111,108,240,.85); }
[data-look="a"] .orbit .ob span.k { background: rgba(20,20,48,.8); border: 1px solid rgba(167,164,255,.5);
  box-shadow: 0 0 0 5px rgba(111,108,240,.10), 0 0 18px rgba(111,108,240,.55), inset 0 0 12px rgba(111,108,240,.35); color: #dcdcff; }
[data-look="a"] .orbit .ob { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; text-shadow: 0 0 8px rgba(167,164,255,.8); }
[data-look="a"] .orbit-scrim { background: radial-gradient(circle at 50% 95%, rgba(60,54,170,.45), rgba(2,2,8,.86) 60%); }
[data-look="a"] .sheet { border-top: 1px solid var(--hair); box-shadow: 0 -10px 40px rgba(111,108,240,.18); }
[data-look="a"] .seg, [data-look="a"] .chips button { border: 1px solid var(--hair); }
[data-look="a"] .seg button[aria-pressed="true"] { background: var(--surface-2); color: #fff; box-shadow: none; }
[data-look="a"] .chips button[aria-pressed="true"] { background: linear-gradient(90deg, #6f6cf0, #18c8ff); color: #fff; }

/* =====================================================================
   Look B · 石墨精工: a precision instrument. Matte graphite, no glow, hairlines, thin large numerals, monochrome rings
   on a tick bezel with only recovery in colour, monospace caps labels, one signal-orange accent for the AI and actions.
   ===================================================================== */
:root[data-look="b"] {
  --bg: #0b0b0c; --surface: #141415; --surface-2: #232325; --text: #f2f2f0; --text-2: #8a8a8e; --text-3: #4a4a4e; --hair: #222224;
  --good: #b6f24a; --mid: #ffb02e; --bad: #ff4d2e; --sleep: #e7e7e4; --strain: #e7e7e4; --ai: #ff5a1f; --ai-soft: rgba(255,90,31,.12);
  --good-soft: rgba(182,242,74,.1); --mid-soft: rgba(255,176,46,.12); --bad-soft: rgba(255,77,46,.12); --sheet: #111112; --chrome: rgba(11,11,12,.97); --page: #050505; --radius: 6px;
  --g-rec-1: #b6f24a; --g-rec-2: #e6ff7a; --g-sl-1: #f2f2f0; --g-sl-2: #9a9a9e; --g-st-1: #f2f2f0; --g-st-2: #9a9a9e;
}
[data-look="b"] .mod, [data-look="b"] .focus, [data-look="b"] .tcard, [data-look="b"] .list, [data-look="b"] .vitals span, [data-look="b"] .ccard, [data-look="b"] .bub.ai {
  border: 1px solid var(--hair); border-radius: 6px; }
[data-look="b"] .focus, [data-look="b"] .list { border-radius: 6px; }
[data-look="b"] .ring .ticks { opacity: .9; stroke: #3a3a3d; }
[data-look="b"] .ring.lg .track, [data-look="b"] .ring.lg .arc { stroke-width: 5; } [data-look="b"] .ring.sm .track, [data-look="b"] .ring.sm .arc { stroke-width: 6; }
[data-look="b"] .ring .arc { stroke-linecap: butt; }
[data-look="b"] .ring .rv { font-weight: 200; letter-spacing: -.04em; } [data-look="b"] .ring.lg .rv { font-size: 64px; } [data-look="b"] .ring.sm .rv { font-size: 46px; }
[data-look="b"] .big { font-weight: 300; letter-spacing: -.03em; } [data-look="b"] .vitals b { font-weight: 300; font-size: 20px; }
[data-look="b"] .hr .hl, [data-look="b"] .vitals i, [data-look="b"] .sh small, [data-look="b"] .date, [data-look="b"] .mod .mh, [data-look="b"] .tab span, [data-look="b"] .why, [data-look="b"] .hr .hs {
  font-family: ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; letter-spacing: .14em; font-size: 10.5px; }
[data-look="b"] .sh h2 { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; letter-spacing: .2em; color: var(--text-2); font-weight: 500; }
[data-look="b"] .sh { border-bottom: 1px solid var(--hair); padding-bottom: 6px; }
[data-look="b"] .sh h2::before { content: "■ "; color: var(--ai); font-size: 8px; vertical-align: 2px; }
[data-look="b"] .top h1 { font-weight: 300; letter-spacing: -.02em; }
[data-look="b"] .brief { background: transparent; border: 1px solid var(--hair); border-left: 2px solid var(--ai); border-radius: 4px; }
[data-look="b"] .brief span { font-weight: 400; }
[data-look="b"] .fi .ic, [data-look="b"] .avatar { border-radius: 4px; }
[data-look="b"] .pill { border-radius: 4px; background: transparent; border: 1px solid #3a3a3d; font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em; font-weight: 500; }
[data-look="b"] .pill.pri, [data-look="b"] .compose .mic { background: var(--ai); border-color: var(--ai); color: #0b0b0c; }
[data-look="b"] .meter, [data-look="b"] .meter i { border-radius: 0; height: 4px; }
[data-look="b"] .dots i { border-radius: 1px; }
[data-look="b"] .chip { background: var(--ai); color: #0b0b0c; border-radius: 3px; }
[data-look="b"] .why { background: transparent; border: 1px solid #3a3a3d; border-radius: 3px; }
[data-look="b"] .tab[aria-current="page"] { color: var(--text); }
[data-look="b"] .tab[aria-current="page"]::after { content: ""; position: absolute; top: -9px; width: 18px; height: 2px; background: var(--ai); }
[data-look="b"] .badge-dot { background: var(--ai); border-radius: 0; width: 6px; height: 6px; }
[data-look="b"] .jkey { background: #0b0b0c; color: var(--text); box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px #3a3a3d, inset 0 0 0 1px #3a3a3d; }
[data-look="b"] .jkey::after { content: ""; position: absolute; top: 9px; right: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
[data-look="b"] .orbit .ob span.k { background: #0b0b0c; border: 1px solid #4a4a4e; border-radius: 50%; box-shadow: 0 0 0 4px #0b0b0c, 0 0 0 5px #222224; }
[data-look="b"] .orbit .ob { font-family: ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; letter-spacing: .14em; font-size: 10.5px; }
[data-look="b"] .orbit-scrim { background: rgba(5,5,5,.88); }
[data-look="b"] .seg { border: 1px solid var(--hair); border-radius: 4px; } [data-look="b"] .seg button { border-radius: 2px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; letter-spacing: .1em; }
[data-look="b"] .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); box-shadow: none; }
[data-look="b"] .chips button { border-radius: 3px; border: 1px solid var(--hair); background: transparent; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
[data-look="b"] .chips button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
[data-look="b"] .avs i, [data-look="b"] .av { border-color: var(--surface); }
[data-look="b"] .sheet { border-radius: 10px 10px 0 0; border-top: 1px solid #2a2a2c; }
.tabbar { z-index: 5; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 440px) { .stage { padding: 12px 0; } .phone { transform: scale(.92); transform-origin: top center; } .ctl { padding: 0 16px; } }
</style>
</head>
<body>
<div class="stage">
  <aside class="ctl">
    <h1>AI 优先 · 渐进解锁</h1>
    <p>原型（合成数据）。见 docs/ui-ai-first-redesign.md。点手机里的卡片、tab 和中间的 Jarvis 键。没有任何功能被锁住：底部「全部功能」随时能看全部。</p>
    <h2>用户状态（都已导入完整历史）</h2>
    <div class="opts" id="personas">
      <button class="opt" data-p="day1">新用户 · 第 1 天<small>选了「睡得更好、训练和恢复」，首页 3 个模块</small></button>
      <button class="opt" data-p="week2">使用 2 周<small>Jarvis 用过的、发现的模块上了首页</small></button>
      <button class="opt" data-p="veteran">老用户<small>首页只放常用的 6 个；异常时临时出现</small></button>
    </div>
    <h2>演示</h2>
    <div class="opts">
      <button class="opt" id="demo-onboard">第 1 天：身体概况 → 选关注 → 摆首页<small>导入历史后的第一次对话</small></button>
      <button class="opt" id="demo-grow">Jarvis 记了喝水 → 「喝水」上首页<small>互动：AI 用过的模块</small></button>
      <button class="opt" id="demo-find">Jarvis 发现 → 带出「体重」<small>数据里值得说的事</small></button>
    </div>
    <h2>视觉方向（待负责人选）</h2>
    <div class="opts" id="looks">
      <button class="opt" data-look-set="a">A · 星环 HUD<small>和 Jarvis 动画同一套：玻璃、渐变环、微光、HUD 角标</small></button>
      <button class="opt" data-look-set="b">B · 石墨精工<small>哑光石墨、细线刻度环、细体大数字、单一信号橙</small></button>
      <button class="opt" data-look-set="">原型默认（v0.2，仅看结构）</button>
    </div>
  </aside>
  <div class="phone" id="phone"><div class="screen">
    <div class="statusbar"><span class="num">9:41</span><span class="isl"></span><span class="bat"></span></div>
    <main class="view" id="view"></main>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" aria-modal="true" role="dialog"><div class="grab"></div>
      <div class="shd"><h3 id="sh-t"></h3><button class="x" id="sh-x" aria-label="关闭"></button></div>
      <div class="sb" id="sh-b"></div><div id="sh-f"></div></section>
    <div class="toast" id="toast"></div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="gRec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g-rec-1, var(--good))"/><stop offset="1" style="stop-color:var(--g-rec-2, var(--good))"/></linearGradient>
      <linearGradient id="gSl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g-sl-1, var(--sleep))"/><stop offset="1" style="stop-color:var(--g-sl-2, var(--sleep))"/></linearGradient>
      <linearGradient id="gSt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g-st-1, var(--strain))"/><stop offset="1" style="stop-color:var(--g-st-2, var(--strain))"/></linearGradient>
    </defs></svg>
    <div class="orbit-scrim" id="oscrim"></div>
    <div class="orbit" id="orbit"></div>
  </div></div>
</div>

// ---------------------------------------------------------------- small charts
function spark(vals, opt = {}) {
  const w = 100, h = 30, lo = Math.min(...vals), hi = Math.max(...vals), x = (i) => (i / (vals.length - 1)) * w, y = (v) => h - 3 - ((v - lo) / (hi - lo || 1)) * (h - 6);
  const d = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  return `<svg class="spark ${opt.cls || ""}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${opt.area ? `<path class="area" d="${d}L${w},${h}L0,${h}Z"/>` : ""}<path d="${d}"/></svg>`;
}
function bars(vals, max, cls, h = 30) {
  const w = 100, bw = w / vals.length;
  return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${vals.map((v, i) => `<rect x="${(i * bw + bw * .18).toFixed(1)}" width="${(bw * .64).toFixed(1)}" y="${(h - (v / max) * h).toFixed(1)}" height="${((v / max) * h).toFixed(1)}" rx="1" fill="currentColor" opacity="${i === vals.length - 1 ? 1 : .45}"/>`).join("")}</svg>`;
}

  const r = 38, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="${r}" fill="none" stroke-width="8"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>
    <text class="v" x="50" y="${unit ? 53 : 58}" text-anchor="middle">${value}</text>${unit ? `<text class="u" x="50" y="69" text-anchor="middle">${unit}</text>` : ""}</svg>`;
}
// The three core scores: gradient arc on a track, a tick bezel (shown by the looks), value and unit inside
function ring(size, frac, grad, value, unit, glow) {
  const r = size === "lg" ? 80 : 74, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg class="ring ${size}" viewBox="0 0 200 200" aria-hidden="true"><circle class="ticks" cx="100" cy="100" r="96" stroke-dasharray="1.2 4.83"/>
    <circle class="track" cx="100" cy="100" r="${r}"/><circle class="arc" cx="100" cy="100" r="${r}" stroke="url(#${grad})" style="--glow:${glow}"
      stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 100 100)"/>
    <text class="rv" x="100" y="${unit ? 108 : 116}" text-anchor="middle">${value}</text>${unit ? `<text class="ru" x="100" y="136" text-anchor="middle">${unit}</text>` : ""}</svg>`;
}
function lineChart(vals, color) {
  const w = 300, h = 110, pad = 14, lo = Math.min(...vals) * .92, hi = Math.max(...vals) * 1.04;
  const x = (i) => pad + (i / (vals.length - 1)) * (w - pad * 2), y = (v) => h - 16 - ((v - lo) / (hi - lo)) * (h - 26);
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length, sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length);
  const d = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="color:${color}" aria-hidden="true">
    <rect class="band" x="${pad}" width="${w - pad * 2}" y="${y(mean + sd).toFixed(1)}" height="${(y(mean - sd) - y(mean + sd)).toFixed(1)}"/>
    <line class="base" x1="${pad}" x2="${w - pad}" y1="${y(mean).toFixed(1)}" y2="${y(mean).toFixed(1)}"/>
    <path class="ln" d="${d}"/><circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3.5" fill="currentColor"/>
    <text x="${pad}" y="${h - 2}">30 天前</text><text x="${w - pad}" y="${h - 2}" text-anchor="end">今天</text>
    <text x="${w - pad}" y="${(y(mean + sd) - 3).toFixed(1)}" text-anchor="end">你的基线</text></svg>`;
}
const dots = (arr, tone) => `<div class="dots tone-${tone}">${arr.map((x) => `<i class="${x ? "on" : ""}"></i>`).join("")}</div>`;

  strain: { n: "负荷", v: "6.0", u: "/ 21", tone: "mid", badge: "偏低", vals: D.strain, color: "var(--strain)", raw: (i) => `${D.strain[29 - i]}`, src: "手表心率" },
  hrv: { n: "HRV", v: "52", u: "ms", tone: "mid", badge: "下降", vals: D.hrv.slice(0, 16).concat(D.hrvDrop), color: "var(--mid)", raw: (i) => `${D.hrvDrop[13 - i] ?? D.hrv[29 - i]} ms`, src: "手表 · 睡眠中" },
  rhr: { n: "静息心率", v: "56", u: "bpm", tone: "good", badge: "正常", vals: D.rhr, color: "var(--good)", raw: (i) => `${D.rhr[29 - i]}`, src: "手表 · 睡眠中" },
};
function detailSheet(k) {
  const d = DETAIL[k]; if (!d) return;
  const rows = Array.from({ length: 7 }, (_, i) => `<tr><td>10/${25 - i}</td><td>${d.raw(i)}</td><td>${d.src}</td></tr>`).join("");
  openSheet(d.n, `<div class="layer"><h4><span class="lv">L1</span>一眼</h4><div class="glance"><span class="big num">${d.v}<small style="font-size:16px;color:var(--text-2)"> ${d.u}</small></span><span class="badge bg-${d.tone} tone-${d.tone}">${d.badge}</span></div></div>
    <div class="layer"><h4><span class="lv">L2</span>趋势 · 30 天</h4>${lineChart(d.vals, d.color)}</div>
    <div class="layer"><h4><span class="lv">L3</span>原始数据</h4><table class="raw"><tr><th>日期</th><th>值</th><th>来源</th></tr>${rows}</table></div>
    <div class="acts" style="margin-top:14px"><button class="pill pri" data-ask="explain">${ic("sparkles")}问 Jarvis 为什么</button><button class="pill">${ic("pin")}固定到首页</button></div>`);
}

// Jarvis half sheet (simplified: the real one is the existing ai.js chat)
function jarvisSheet(msgs = "", sugg = true) {
  const s = ["今天该练什么", "记一顿饭", "我睡得怎么样"];
  openSheet(`${ic("orbit")}Jarvis`, `<div class="msgs" id="msgs">${msgs}</div>${sugg && !msgs ? `<div class="sugg">${s.map((x) => `<button>${x}</button>`).join("")}</div>` : ""}`,
    `<div class="compose"><span class="in">说点什么，或按住说话</span><span class="mic">${ic("mic")}</span></div>`);
}
function addMsg(html) { const m = $("#msgs"); if (!m) return; m.insertAdjacentHTML("beforeend", html); $("#sh-b").scrollTop = 1e4; }
async function typing(ms) { addMsg(`<div class="bub ai typing" id="typing"><i></i><i></i><i></i></div>`); await sleep(ms); $("#typing")?.remove(); }
const findCard = (icon, area, title, big, unit, chart, tone) => `<div class="ccard find"><div class="ch">${ic(icon)}${area}</div><b class="ft">${title}</b><div class="row2"><div><b class="num tone-${tone}">${big}</b><small>${unit}</small></div><div style="flex:1">${chart}</div></div></div>`;

// ---------------------------------------------------------------- demo 0: day 1. History is imported -> "your body at a glance" (3 findings) -> what do you care about -> Today is laid out
let demoRun = 0;
async function demoOnboard(auto = true) {
  const run = ++demoRun;
  setPersona("day1");
  S.onboarding = true; S.pinned = []; render();
  jarvisSheet("", false);
  $("#sheet").classList.add("tall");
  addMsg(`<div class="ccard"><div class="ch">${ic("check")}Apple 健康历史已导入</div><div class="row2"><div><b class="num">3.2 年</b><small>数据</small></div><div><b class="num">1,140</b><small>晚睡眠</small></div><div><b class="num">412</b><small>次训练</small></div></div></div>`);
  await typing(auto ? 900 : 300); if (run !== demoRun) return;
  addMsg(`<div class="bub ai">先给你看 3 个最重要的发现：</div>`);
  addMsg(findCard("heart-pulse", "恢复", "HRV 近 2 周下降 12%", "52", "ms · 基线 59", `<span class="tone-mid">${spark(D.hrvDrop)}</span>`, "mid"));
  addMsg(findCard("moon", "睡眠", "平均 01:24 入睡，周末再晚 1 小时", "01:24", "平均入睡", `<span class="tone-sleep">${bars([6, 7, 5, 7, 4, 3, 2], 7, "tone-sleep")}</span>`, "sleep"));
  addMsg(findCard("dumbbell", "训练", "每周 4 次，力量为主，最近偏累", "−18", "TSB", `<span class="tone-strain">${bars([9, 12, 14, 13, 15, 16, 17], 18, "tone-strain")}</span>`, "strain"));
  $("#sh-b").scrollTop = 0;
  await sleep(auto ? 2200 : 600); if (run !== demoRun) return;
  addMsg(`<div class="bub ai">你最关心哪些？可以多选，以后随时能改。</div><div class="goalchips" id="goals">${GOALS.map(([k, t]) => `<button data-goal="${k}" aria-pressed="false">${t}</button>`).join("")}</div>
    <div class="acts"><button class="pill pri" id="goal-ok">好了</button><button class="pill">先跳过</button></div>`);
  const picked = new Set();
  for (const b of $$("[data-goal]")) b.onclick = () => { picked.has(b.dataset.goal) ? picked.delete(b.dataset.goal) : picked.add(b.dataset.goal); b.setAttribute("aria-pressed", picked.has(b.dataset.goal)); };
  await sleep(600);
  for (const k of ["sleep", "recover"]) { $(`[data-goal="${k}"]`).click(); await sleep(300); }
  const ok = $("#goal-ok");
  await new Promise((res) => { ok.onclick = res; if (auto) setTimeout(res, 1600); }); if (run !== demoRun) return;
  ok.parentElement.remove();
  addMsg(`<div class="bub me">睡得更好、训练和恢复</div>`);
  await typing(800); if (run !== demoRun) return;
  addMsg(`<div class="bub ai">好。首页先放 3 个：HRV（它在下降）、睡眠规律、入睡目标。其他功能都在「全部功能」里，随时能看。</div>`);
  await sleep(auto ? 1800 : 400); if (run !== demoRun) return;
  closeSheet(); $("#sheet").classList.remove("tall");
  S.onboarding = false; S.pinned = ["hrv", "regularity", "sleepgoal"]; S.grown = new Set(S.pinned); render();
  await sleep(300); $(".mod.grow")?.scrollIntoView({ block: "center" });
}

// ---------------------------------------------------------------- demo 1: Jarvis logs water for the first time -> 喝水 goes to Today
async function demoGrow(auto = true) {
  const run = ++demoRun;
  setPersona("week2");
  await sleep(auto ? 700 : 0);
  jarvisSheet("", false);
  await sleep(500); if (run !== demoRun) return;
  addMsg(`<div class="bub me"><div class="vt">${ic("audio-waveform")}语音 · 0:04</div>中午吃了一碗牛肉面，喝了一瓶水</div>`);
  await typing(1100); if (run !== demoRun) return;
  addMsg(`<div class="ccard"><div class="ch">${ic("utensils")}午餐<span class="ok">${ic("check")}已记</span></div><div class="row2"><div><b class="num">620</b><small>kcal</small></div><div><b class="num">28 g</b><small>蛋白</small></div><div><b class="num">1,240</b><small>今天</small></div></div></div>`);
  await sleep(500);
  addMsg(`<div class="ccard"><div class="ch">${ic("droplet")}喝水<span class="ok">${ic("check")}已记</span></div><div class="row2"><div><b class="num">500 ml</b><small>今天 / 2,500</small></div></div>
    <div class="acts"><button class="pill pri" id="pin-water">${ic("pin")}放到首页</button><button class="pill">不用</button></div></div>`);
  await sleep(300);
  addMsg(`<div class="bub ai">记好了。第一次记喝水，要把「喝水」放到首页吗？以后说一句「喝了一杯」就行。</div>`);
  const pin = $("#pin-water");
  await new Promise((res) => { pin.onclick = res; if (auto) setTimeout(res, 2200); }); if (run !== demoRun) return;
  pin.classList.add("on"); pin.classList.remove("pri"); pin.innerHTML = `${ic("check")}已放到首页`;
  await sleep(700);
  closeSheet();
  S.pinned.unshift("water"); S.why.water = "用过"; S.seen.add("water"); S.grown = new Set(["water"]); render();
  await sleep(350);
  $(".mod.grow")?.scrollIntoView({ block: "center" });
  toast(`${ic("sparkles")}「喝水」已放到首页 · 长按可移走`);
}

// ---------------------------------------------------------------- demo 2: Jarvis finds something in the data and brings the module out
async function demoFind(k = "weight") {
  if (S.p !== "week2") setPersona("week2");
  jarvisSheet("", false);
  await sleep(250);
  addMsg(`<div class="ccard"><div class="ch">${ic("scale")}体重 · 3 周</div><div class="row2"><div><b class="num">72.6</b><small>kg</small></div><div><b class="num">±0.2</b><small>3 周波动</small></div></div><span class="tone-mid">${spark(D.weight)}</span>
    <div class="acts"><button class="pill pri" id="pin-f">${ic("pin")}放到首页</button><button class="pill" id="later">先不用</button></div></div>`);
  addMsg(`<div class="bub ai">我注意到你的体重 3 周没怎么变，而这 3 周平均每天比目标多吃 180 kcal。要把「体重」放到首页一起盯着吗？</div>`);
  $("#pin-f").onclick = async () => { closeSheet(); S.finding = null; S.pinned.push(k); S.why[k] = "发现"; S.seen.add(k); S.grown = new Set([k]); render(); await sleep(300); $(".mod.grow")?.scrollIntoView({ block: "center" }); toast(`${ic("sparkles")}「体重」已放到首页`); };
  $("#later").onclick = () => { closeSheet(); S.finding = null; S.seen.add(k); render(); toast(`${ic("layout-grid")}在「全部功能」和「身体」里随时能看`); };
}

// ---------------------------------------------------------------- Jarvis ring menu
const ORBIT = [["bot-message-square", "对话"], ["audio-waveform", "语音"], ["scan-eye", "拍照"], ["zap", "快记"]];
function setOrbit(on) {
  S.orbit = on;
  $("#orbit").innerHTML = ORBIT.map(([i, t]) => `<button class="ob"><span class="k">${ic(i)}</span>${t}</button>`).join("");
  requestAnimationFrame(() => { $("#orbit").classList.toggle("on", on); $("#oscrim").classList.toggle("on", on); });
  $("#jkey").classList.toggle("open", on);
  for (const b of $$("#orbit .ob")) b.onclick = () => { setOrbit(false); jarvisSheet(); };
}

// ---------------------------------------------------------------- events
function bind() {
  for (const b of $$("[data-tab]")) b.onclick = () => go(b.dataset.tab);
  for (const b of $$("[data-go]")) b.onclick = (e) => { e.stopPropagation(); go(b.dataset.go); };
  for (const b of $$("[data-detail]")) b.onclick = () => detailSheet(b.dataset.detail);
  for (const b of $$("[data-intro]")) b.onclick = () => demoFind(b.dataset.intro);
  for (const b of $$("[data-cmode]")) b.onclick = () => { S.circMode = b.dataset.cmode; render(); };
  for (const b of $$("[data-invite]")) b.onclick = (e) => { e.stopPropagation(); toast(`${ic("user-plus")}邀请链接已复制 · 7 天内有效`); };
  for (const b of $$("[data-focus], [data-ask], [data-mod]")) b.onclick = () => jarvisSheet();
  $("#jkey").onclick = () => setOrbit(!S.orbit);
}
$("#sh-x").innerHTML = ic("x");
$("#sh-x").onclick = () => closeSheet();
$("#scrim").onclick = () => closeSheet();
for (const b of $$("#personas .opt")) b.onclick = () => { demoRun++; setPersona(b.dataset.p); };
$("#demo-onboard").onclick = () => demoOnboard(true);
$("#demo-grow").onclick = () => demoGrow(true);
$("#demo-find").onclick = () => { demoRun++; demoFind(); };
function setLook(l) { document.documentElement.dataset.look = l; for (const b of $$("#looks .opt")) b.setAttribute("aria-pressed", b.dataset.lookSet === l); }
for (const b of $$("[data-look-set]")) b.onclick = () => setLook(b.dataset.lookSet);
$("#oscrim").onclick = () => setOrbit(false);
window.Proto = { setPersona, setLook, setOrbit, go, demoOnboard, demoGrow, demoFind, detailSheet, jarvisSheet, closeSheet, S };
const q = new URLSearchParams(location.search);
if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
setLook(q.get("look") ?? "a");
setPersona(q.get("p") || "week2");
</script>
