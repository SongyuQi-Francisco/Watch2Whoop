<!doctype html><html><head><meta charset="utf-8"><title>Jarvis key</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1D1D20;color:#F4F4F6;font-family:system-ui;-webkit-font-smoothing:antialiased}
.board{width:1200px;padding:48px 56px}
h1{font-size:15px;font-weight:500;color:#8D8D94;letter-spacing:.5px;margin-bottom:28px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:28px}
.col h2{font-size:20px;font-weight:600;margin:0 0 4px}.col p{font-size:12.5px;color:#8D8D94;margin-bottom:18px;min-height:34px}
.stage{border-radius:24px;height:230px;display:flex;align-items:center;justify-content:center;background:#000;margin-bottom:12px}
.stage.l{background:#F2F2F4;height:120px}
.key{border-radius:50%;display:block;background:rgba(44,44,48,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#F4F4F6}
.l .key{background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.10);color:#111113}
.key svg{display:block;width:100%;height:100%}
.bar{margin-top:6px;height:96px;border-radius:24px;background:#000;position:relative}
.bar .tabs{position:absolute;left:14px;right:14px;bottom:10px;height:44px;border-radius:22px;background:rgba(44,44,48,.9)}
.bar .key{position:absolute;left:50%;margin-left:-29px;top:6px;width:58px;height:58px}
</style></head><body><script>
var TRI="M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"; // Lucide "triangle" (ISC), rotated 180 deg
var ORB='<path d="M20.341 6.484A10 10 0 0 1 10.266 21.85"/><path d="M3.659 17.516A10 10 0 0 1 13.74 2.152"/><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/>'; // Lucide "orbit" (current key)
function tri(sc,sw,fill){return '<g transform="translate(50 50) rotate(180) scale('+sc+') translate(-12 -14.4)"><path d="'+TRI+'" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"/></g>'}
function ring(r,w,o){return '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="currentColor" stroke-width="'+w+'" opacity="'+(o||1)+'"/>'}
function ticks(n,r0,r1,w){var s='';for(var i=0;i<n;i++){var a=(i/n*360-90)*Math.PI/180;s+='<line x1="'+(50+r0*Math.cos(a)).toFixed(2)+'" y1="'+(50+r0*Math.sin(a)).toFixed(2)+'" x2="'+(50+r1*Math.cos(a)).toFixed(2)+'" y2="'+(50+r1*Math.sin(a)).toFixed(2)+'" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" opacity=".55"/>'}return s}
var K={
 '0':['现在 · orbit','现在样稿里的按键（对照）','<g transform="translate(50 50) scale(1.9) translate(-12 -12)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ORB+'</g>'],
 '1':['K1 · 倒三角','只有一个倒三角，最简',tri(2.2,2.1)],
 '2':['K2 · 核心','倒三角 + 中间实心小三角',tri(2.3,1.9)+tri(.78,0,1)],
 '3':['K3 · 环 + 核心','细环套倒三角，中心一个点',ring(36,2.6)+tri(2.05,1.9)+'<circle cx="50" cy="50" r="4.6" fill="currentColor"/>'],
 '4':['K4 · 刻度核心','表盘的刻度围着倒三角',ticks(24,34,40,2.2)+tri(1.95,2)+tri(.66,0,1)]
};
var h='<div class="board"><h1>JARVIS KEY · 2.0.1 · 倒三角核心</h1><div class="row">';
Object.keys(K).forEach(function(k){var svg='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+K[k][2]+'</svg>';
 h+='<div class="col"><h2>'+K[k][0]+'</h2><p>'+K[k][1]+'</p><div class="stage"><span class="key" style="width:174px;height:174px">'+svg+'</span></div><div class="stage l"><span class="key" style="width:58px;height:58px">'+svg+'</span></div><div class="bar"><div class="tabs"></div><span class="key">'+svg+'</span></div></div>'});
document.body.innerHTML=h+'</div></div>';
</script></body></html>
