<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>今天 · strain L1</title>
<link rel="stylesheet" href="kit.css">
<style>
/* L0 = 01-today, unchanged and not dimmed. L1 sheet top at y 368 (11 pt under the verdict word; the dial stays readable). */
.hero{margin-top:32px}
.gauges{margin-top:40px}
.sheet{top:368px}
/* reading line: the gauge number that the sheet now covers, plus the planned end of the day */
.p-read{display:flex;align-items:baseline;height:28px}
.p-read .t-label{margin-left:6px}
.p-plan{margin-left:auto;display:flex;align-items:baseline;gap:6px}
.p-plan svg{align-self:center}
.p-plan .v{font-size:17px;font-weight:500;letter-spacing:-0.2px}
/* day line 00:00-24:00 */
.p-chart{position:relative;height:80px;margin-top:12px}
.p-day{display:block;overflow:visible}
.p-ax{font-size:10px;font-weight:500;fill:var(--text2);font-family:system-ui}
.p-blk{position:absolute;top:2px;display:flex;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--text2);transform:translateX(-50%)}
.p-blk i{font-size:11px;color:var(--train)}
.p-tl{width:318px;display:flex;justify-content:space-between;margin-top:4px;font-size:10px;font-weight:500;color:var(--text2)}
/* rows: bullet gauges (value, usual-by-now line, goal tick) and one DiffBar */
.rows{margin-top:12px}
.p-g{padding-top:5px}
.exits{margin-top:14px}
</style>
</head>

<!-- L0 behind the sheet (unchanged, not dimmed; a tap on it closes the sheet) -->
<main class="page">
  <header class="hdr">
    <div class="hdr-date">11月10日<i data-i="chevron-down"></i></div>
    <div class="sync is-ok"><i data-i="circle-check"></i>2分前</div>
  </header>
  <section class="hero">
    <div class="dial" data-dial="82" data-band="58 74" data-zones="34 67" data-tone="good"></div>
    <div class="dial-core">
      <div class="hero-label">恢复</div>
      <div class="hero-num"><span class="t-hero">82</span><span class="pct">%</span></div>
      <div class="minibars" style="--tone:var(--good)">
        <b style="height:9.5px"></b><b style="height:12px"></b><b style="height:6.5px"></b><b style="height:11px"></b>
        <b style="height:13px"></b><b style="height:11.4px"></b><b style="height:16px"></b>
      </div>
      <div class="verdict t-verdict">可上强度</div>
    </div>
  </section>
  <section class="gauges">
    <div class="gauge">
      <div class="gauge-hd"><span class="t-gauge">88</span><span class="t-label">睡眠</span></div>
      <div class="gauge-bar" data-gauge="88" data-max="100" data-band="72 84" data-tone="sleep" data-step="10"></div>
    </div>
    <div class="gauge">
      <div class="gauge-hd"><span class="t-gauge">2.8</span><span class="t-label">负荷</span></div>
      <div class="gauge-bar" data-gauge="2.8" data-max="21" data-target="12 16" data-plan="13.4" data-tone="train" data-step="2" data-majors="10 14 18"></div>
    </div>
  </section>
</main>
<div class="jarvis"><i data-i="orbit"></i></div>
<nav class="tabbar">
  <div class="tab on"><i data-i="circle-gauge"></i>今天</div>
  <div class="tab"><i data-i="activity"></i>身体</div>
  <div class="tab"><i data-i="square-plus"></i>记录</div>
  <div class="tab"><i data-i="users"></i>圈子</div>
  <div class="tab"><i data-i="user"></i>我</div>
</nav>

  <div class="rows">
    <div class="row">
      <span class="row-l">步数</span>
      <div class="spark p-g" data-gauge="3860" data-max="10000" data-target="8000" data-band="2700 3800" data-tone="text"></div>
      <span class="row-v"><span class="t-row">3,860</span><span class="u">步</span></span>
      <span class="delta good">+540</span><i class="chev" data-i="chevron-right"></i>
    </div>
    <div class="row">
      <span class="row-l">活动能量</span>
      <div class="spark p-g" data-gauge="186" data-max="700" data-target="550" data-band="140 230" data-tone="text"></div>
      <span class="row-v"><span class="t-row">186</span><span class="u">kcal</span></span>

    <div class="row">

      <span class="row-v"><span class="t-row">12</span><span class="u">分</span></span>
      <span class="delta">−4</span><i class="chev" data-i="chevron-right"></i>
