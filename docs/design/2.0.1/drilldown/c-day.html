<!doctype html>
<html lang="zh-Hans" data-opt="ladder">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>C 层级 · 今日详情 (level 2)</title>
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="dd.css">
<style>
/* Level 2. The dial has shrunk into the header (it is the way up); the ladder shows two of three. 训练 · 今晚 · 提醒 are
   the first row here. ?state=zoom draws the middle of the transition for the board. */
.zoomdial{display:none}
html[data-state="zoom"] .zoomdial{display:block;position:absolute;left:38px;top:92px;width:150px;height:150px;z-index:5}
html[data-state="zoom"] .zoomdial > div{width:150px;height:150px}
html[data-state="zoom"] .zoomdial span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:200;letter-spacing:-1.5px}
html[data-state="zoom"] .page > *:not(.hdr){opacity:0.22}
html[data-state="zoom"] .hdr-back .mini,html[data-state="zoom"] .hdr-back .t-date{visibility:hidden}
</style>
</head>
<body>
<div data-part="sb"></div>
<main class="page">
  <header class="hdr">
    <div class="hdr-back"><i data-i="chevron-left"></i><span class="mini"><div data-ring="82" data-w="3" data-tone="good"></div><span>82</span></span><span class="t-date">11月10日</span></div>
    <div class="hdr-r"><div data-part="ladder" data-n="2"></div></div>
  </header>
  <div data-part="day" data-with="chips"></div>
</main>
<div class="zoomdial"><div data-dial="82" data-band="58 74" data-zones="34 67" data-tone="good"></div><span>82</span></div>
<div class="keyband"></div>
<div data-part="chrome" data-on="0"></div>
<script src="dd.js"></script>
<script src="../kit.js"></script>
<script src="../core.js"></script>
</body>
</html>
