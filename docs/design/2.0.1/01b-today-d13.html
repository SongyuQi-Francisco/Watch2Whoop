<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>今天 · D13 comparison (three rings)</title>
<link rel="stylesheet" href="kit.css">
<style>
/* D13 comparison only: the same Today with three rings (recovery large in the middle, sleep and strain beside it).
   Everything else is identical to 01-today, so the owner compares one thing: two rings vs two gauges.
   Geometry: at 402 pt a row of three circles caps the middle ring at ~200 pt (R + 2r <= 173), which leaves ~120 pt of
   air above and below. So the recovery dial keeps its 01 size and place (280, 130-410, verdict inside) and the two rings
   (120) sit beside its lower half, flush with the gutters, 14 pt clear of the dial: 379-499, the gauges' slot in 01.
   Rhythm: header 54-98 -> 32 -> dial 130-410 / rings 379-499 -> 54 -> faces 553-673 -> 49 -> key 722.
   The rings carry what the gauges carry: sleep = usual lane; strain = target 12-16 (tint + ticks), now, planned dots. */
.hero{margin-top:32px}
.faces{margin-top:143px}
.p-sides{position:absolute;left:20px;right:20px;top:325px;height:120px;display:flex;justify-content:space-between;pointer-events:none}
.p-ring{position:relative;width:120px;height:120px}
.p-ring .p-ov{position:absolute;left:0;top:0;overflow:visible}
.p-ring .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.p-ring .n{font-size:30px;font-weight:300;letter-spacing:-0.5px;line-height:1}
.p-ring .l{font-size:12px;font-weight:500;color:var(--text2);margin-top:5px}
.vitals rect{fill:var(--band)}
.vitals circle{fill:var(--text)}
</style>
</head>
<body>

<!-- status bar -->
<div class="sb">
  <div class="sb-time">9:41</div><div class="sb-island"></div>
  <div class="sb-sys">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.2a10.4 10.4 0 0 1 14.6 0"/><path d="M3.9 6.9a6.5 6.5 0 0 1 9.2 0"/><circle cx="8.5" cy="9.9" r="1.2" fill="currentColor" stroke="none"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.6" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"/><path d="M25 4.5v4c.9-.3 1.5-1.1 1.5-2s-.6-1.7-1.5-2z" fill="currentColor" fill-opacity="0.45"/></svg>
  </div>
</div>

<main class="page">
  <!-- header: date (tap = month calendar, swipe hero = other day) + sync state (tap = sync now) -->
  <header class="hdr">
    <div class="hdr-date">11月10日<i data-i="chevron-down"></i></div>
    <div class="sync is-ok"><i data-i="circle-check"></i>2分前</div>
  </header>

  <!-- D13 middle ring: the recovery dial, exactly as in 01 (verdict inside) -->
  <section class="hero">
    <div class="dial" data-dial="82" data-band="58 74" data-zones="34 67" data-tone="good"></div>
    <div class="dial-core">
      <div class="hero-label">恢复</div>
      <div class="hero-num"><span class="t-hero">82</span><span class="pct">%</span></div>
      <div class="minibars" style="--tone:var(--good)">
        <b style="height:9.5px"></b><b style="height:12px"></b><b style="height:6.5px"></b><b style="height:11px"></b>
        <b style="height:13px"></b><b style="height:11.4px"></b><b style="height:16px"></b>
      </div>
      <div class="verdict t-verdict">可上强度</div>
    </div>
  </section>

  <!-- D13 side rings (tap = sleep / strain L1, as the gauges in 01) -->
  <div class="p-sides">
    <div class="p-ring">
      <div data-dial="88" data-band="72 84" data-tone="sleep" data-ticks="50" style="width:120px;height:120px"></div>
      <div class="core"><div class="n">88</div><div class="l">睡眠</div></div>
    </div>
    <div class="p-ring">
      <div data-dial="2.8" data-max="21" data-zones="10 14 18" data-tone="train" data-ticks="42" style="width:120px;height:120px"></div>
      <svg class="p-ov" width="120" height="120" viewBox="0 0 120 120" fill="none"><path d="M35.27 111.36A57 57 0 0 1 3.16 55.74" stroke="var(--train)" stroke-opacity="0.22" stroke-width="8"/><line x1="37.22" y1="107.3" x2="33.32" y2="115.41" stroke="var(--train)" stroke-width="1.5" stroke-linecap="round"/><line x1="7.65" y1="56.08" x2="-1.33" y2="55.4" stroke="var(--train)" stroke-width="1.5" stroke-linecap="round"/><circle cx="106.13" cy="26.52" r="1.25" fill="var(--train)"/><circle cx="108.63" cy="30.26" r="1.25" fill="var(--train)"/><circle cx="110.82" cy="34.19" r="1.25" fill="var(--train)"/><circle cx="112.7" cy="38.28" r="1.25" fill="var(--train)"/><circle cx="114.25" cy="42.5" r="1.25" fill="var(--train)"/><circle cx="115.46" cy="46.84" r="1.25" fill="var(--train)"/><circle cx="116.32" cy="51.25" r="1.25" fill="var(--train)"/><circle cx="116.84" cy="55.72" r="1.25" fill="var(--train)"/><circle cx="117" cy="60.22" r="1.25" fill="var(--train)"/><circle cx="116.8" cy="64.71" r="1.25" fill="var(--train)"/><circle cx="116.26" cy="69.18" r="1.25" fill="var(--train)"/><circle cx="115.36" cy="73.58" r="1.25" fill="var(--train)"/><circle cx="114.11" cy="77.91" r="1.25" fill="var(--train)"/><circle cx="112.53" cy="82.12" r="1.25" fill="var(--train)"/><circle cx="110.62" cy="86.19" r="1.25" fill="var(--train)"/><circle cx="108.4" cy="90.11" r="1.25" fill="var(--train)"/><circle cx="105.88" cy="93.83" r="1.25" fill="var(--train)"/><circle cx="103.07" cy="97.34" r="1.25" fill="var(--train)"/><circle cx="99.99" cy="100.62" r="1.25" fill="var(--train)"/><circle cx="96.66" cy="103.65" r="1.25" fill="var(--train)"/><circle cx="93.1" cy="106.4" r="1.25" fill="var(--train)"/><circle cx="89.34" cy="108.87" r="1.25" fill="var(--train)"/><circle cx="85.39" cy="111.03" r="1.25" fill="var(--train)"/><circle cx="81.29" cy="112.87" r="1.25" fill="var(--train)"/><circle cx="77.05" cy="114.39" r="1.25" fill="var(--train)"/><circle cx="72.71" cy="115.56" r="1.25" fill="var(--train)"/><circle cx="68.29" cy="116.39" r="1.25" fill="var(--train)"/><circle cx="63.82" cy="116.87" r="1.25" fill="var(--train)"/><circle cx="59.32" cy="117" r="1.25" fill="var(--train)"/><circle cx="54.83" cy="116.76" r="1.25" fill="var(--train)"/><circle cx="50.37" cy="116.18" r="1.25" fill="var(--train)"/><circle cx="45.96" cy="115.24" r="1.25" fill="var(--train)"/><circle cx="41.65" cy="113.97" r="1.25" fill="var(--train)"/><circle cx="37.45" cy="112.35" r="1.25" fill="var(--train)"/><circle cx="33.39" cy="110.41" r="1.25" fill="var(--train)"/><circle cx="29.5" cy="108.15" r="1.25" fill="var(--train)"/><circle cx="25.8" cy="105.6" r="1.25" fill="var(--train)"/><circle cx="22.31" cy="102.76" r="1.25" fill="var(--train)"/><circle cx="19.05" cy="99.65" r="1.25" fill="var(--train)"/></svg>
      <div class="core"><div class="n">2.8</div><div class="l">负荷</div></div>
    </div>
  </div>

  <!-- module faces: identical to 01 -->
  <section class="faces">
    <div class="face">
      <div class="face-hd"><i data-i="heart-pulse"></i>体征</div>
      <div class="face-num"><span class="t-face">5/5</span></div>
      <div class="face-gfx">
        <svg class="vitals" width="91" height="26" viewBox="0 0 91 26">
          <rect x="0" y="1" width="6.5" height="24" rx="3.25"/><circle cx="3.25" cy="10" r="2.5"/>
          <rect x="21" y="1" width="6.5" height="24" rx="3.25"/><circle cx="24.25" cy="7" r="2.5"/>
          <rect x="42" y="1" width="6.5" height="24" rx="3.25"/><circle cx="45.25" cy="14.5" r="2.5"/>
          <rect x="63" y="1" width="6.5" height="24" rx="3.25"/><circle cx="66.25" cy="17" r="2.5"/>
          <rect x="84.5" y="1" width="6.5" height="24" rx="3.25"/><circle cx="87.75" cy="11.5" r="2.5"/>
        </svg>
      </div>
    </div>
    <div class="face">
      <div class="face-hd"><i data-i="soup"></i>饮食</div>
      <div class="face-num"><span class="t-face">420</span><span class="u">kcal</span></div>
      <div class="face-gfx"><div data-gauge="420" data-max="2500" data-target="2100" data-tone="text" data-step="500" style="width:100%;height:22px"></div></div>
    </div>
    <div class="face">
      <div class="face-hd"><i data-i="users"></i>圈子</div>
      <div class="face-num"><span class="t-face">3</span><span class="u">人练了</span></div>
      <div class="face-gfx avs"><span class="av on">鹿</span><span class="av on">杰</span><span class="av">木</span><span class="av on">K</span><span class="av">安</span></div>
    </div>
  </section>
</main>

<!-- Jarvis key + system tab bar (今天 · 身体 · 记录 · 圈子 · 我) + home indicator -->
<div class="jarvis"><i data-i="orbit"></i></div>
<nav class="tabbar">
  <div class="tab on"><i data-i="circle-gauge"></i>今天</div>
  <div class="tab"><i data-i="activity"></i>身体</div>
  <div class="tab"><i data-i="square-plus"></i>记录</div>
  <div class="tab"><i data-i="users"></i>圈子</div>
  <div class="tab"><i data-i="user"></i>我</div>
</nav>
<div class="home-ind"></div>
<script src="kit.js"></script>
</body>
</html>
