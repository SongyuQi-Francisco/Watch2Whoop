<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>同步中心 · behind</title>
<link rel="stylesheet" href="kit.css">
<style>
/* Sync center, opened from the Today sync capsule (behind state). Not a hero L1, so the page behind is dimmed.
   Sheet top 176 (custom detent 690: cuts the dial ring, never a digit), content: title -> sync dial 200 -> one primary button -> the one self-help step ->
   4 type lanes (14 days) + 3 dates -> quiet exit. Order = answer, action, evidence. */
.hero{margin-top:32px}
.gauges{margin-top:40px}
.sheet{top:176px}
.p-dialbox{position:relative;width:200px;height:200px;margin:18px auto 0}
.p-sdial{position:absolute;inset:0}
.p-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.p-core .hero-label{font-size:12px;letter-spacing:1.5px;margin-right:-1.5px}
.p-miss{display:flex;align-items:baseline;color:var(--mid);margin-top:2px}
.p-miss b{font-size:64px;font-weight:200;letter-spacing:-1.5px;line-height:1;margin:0 3px}
.p-miss span{font-size:20px;font-weight:300}
.btn-primary{margin-top:28px}
.p-help{height:44px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500}
.p-help i:first-child{font-size:17px;color:var(--mid)}
.p-help .chev{font-size:14px;color:var(--text3)}
.p-lanes{margin-top:30px;border-top:1px solid var(--hair);padding-top:6px}
.p-lane{display:grid;grid-template-columns:50px 286px;column-gap:14px;align-items:center;height:30px}
.p-dates{position:relative;height:14px;margin:4px 0 0 64px}
.p-dates span{position:absolute;top:0;transform:translateX(-50%);font-size:10px;font-weight:500;color:var(--text2);white-space:nowrap}
.p-dates span:last-child{transform:translateX(-80%)}
.p-more{height:44px;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:500;color:var(--text2)}
.p-more i{font-size:14px;color:var(--text3)}
.vitals rect{fill:var(--band)}
.vitals circle{fill:var(--text)}
</style>
</head>
<body>

<div class="sb" style="z-index:80"><!-- status bar stays above the dimming, as in iOS -->
  <div class="sb-time">9:41</div><div class="sb-island"></div>
  <div class="sb-sys">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.2a10.4 10.4 0 0 1 14.6 0"/><path d="M3.9 6.9a6.5 6.5 0 0 1 9.2 0"/><circle cx="8.5" cy="9.9" r="1.2" fill="currentColor" stroke="none"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.6" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"/><path d="M25 4.5v4c.9-.3 1.5-1.1 1.5-2s-.6-1.7-1.5-2z" fill="currentColor" fill-opacity="0.45"/></svg>
  </div>
</div>

<!-- Today behind the sheet (same page as 01, capsule in the behind state: it is what was tapped). Dimmed by the scrim. -->
<main class="page">
  <header class="hdr">
    <div class="hdr-date">11月10日<i data-i="chevron-down"></i></div>
    <div class="sync is-stale"><i data-i="circle-alert"></i>缺2天</div>
  </header>
  <section class="hero">
    <div class="dial" data-dial="82" data-band="58 74" data-zones="34 67" data-tone="good"></div>
    <div class="dial-core">
      <div class="hero-label">恢复</div>
      <div class="hero-num"><span class="t-hero">82</span><span class="pct">%</span></div>
      <div class="minibars" style="--tone:var(--good)">
        <b style="height:9.5px"></b><b style="height:12px"></b><b style="height:6.5px"></b><b style="height:11px"></b>
        <b style="height:13px"></b><b style="height:11.4px"></b><b style="height:16px"></b>
      </div>
      <div class="verdict t-verdict">可上强度</div>
    </div>
  </section>
</main>
<div class="jarvis"><i data-i="orbit"></i></div>
<nav class="tabbar">
  <div class="tab on"><i data-i="circle-gauge"></i>今天</div>
  <div class="tab"><i data-i="activity"></i>身体</div>
  <div class="tab"><i data-i="users"></i>圈子</div>
  <div class="tab"><i data-i="user"></i>我</div>
</nav>
<div class="scrim"></div>

<!-- SYNC CENTER (behind). Dial: 30 batons = last 30 days, the two newest in mid. One primary action. One self-help step
     (≤ 6 characters, opens this app's page in Settings). Lanes: filled = on the server, hollow mid = on the phone but not on
     the server (tap = re-sync that day), small grey = nothing to sync (no training / watch not worn). -->

  <div class="grabber"></div>
  <div class="sheet-hd">
    <span class="t-title">同步中心</span>
    <span class="icon-btn"><i data-i="x"></i></span>
  </div>

    <div class="p-core">
      <div class="hero-label">近30天</div>

  </div>

  <div class="btn-primary"><i data-i="refresh-cw"></i>立即同步</div>
