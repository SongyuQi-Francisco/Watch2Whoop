<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>训练 · today's session</title>
<link rel="stylesheet" href="kit.css">
<style>
/* Today's session, second level (pushed from the Today training entry / the 18:30 block in the strain L1).
   Rhythm (y): header 54-98 -> 22 -> segmented arc 120-360 (240: rows must fit) -> 20 -> 5 exercise rows 380-611
   -> 17 -> primary button 628-676 (pinned; rows scroll under it) -> 46 -> Jarvis key 722. Below the fold: faces 本周 / 肌肉 / 历史. */
.p-hero{position:relative;width:240px;height:240px;margin:22px auto 0}
.p-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.p-num{display:flex;align-items:baseline;margin-top:2px}
.p-num .of{font-size:24px;font-weight:300;color:var(--text2);margin-left:4px;letter-spacing:-0.2px}
.p-num .of span{font-size:15px;font-weight:500;margin-left:3px}
.p-timer{margin-top:8px;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:500;color:var(--text2)}
.p-timer i{font-size:14px}
.p-list{margin-top:20px;border-top:1px solid var(--hair)}
.p-ex{display:grid;grid-template-columns:1fr 46px 92px 12px;align-items:center;column-gap:12px;height:46px;border-bottom:1px solid var(--hair)}
.p-nm{font-size:15px;font-weight:500;white-space:nowrap}
.p-done .p-nm{color:var(--text2)}
.p-sd{display:flex;justify-content:flex-start}
.p-wt{text-align:right;white-space:nowrap}
.p-x{font-size:13px;font-weight:500;color:var(--text2);margin-left:6px}
.p-ex .chev{color:var(--text3);font-size:13px}
.p-cta{position:absolute;left:20px;right:20px;top:628px;background:var(--surface);color:var(--text)}
.p-cta i{font-size:17px;color:var(--text2)}  /* kit primary button, quiet fill: the arc stays the first thing the eye lands on */
</style>
</head>
<body>

<div class="sb">
  <div class="sb-time">18:52</div><div class="sb-island"></div>
  <div class="sb-sys">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.2a10.4 10.4 0 0 1 14.6 0"/><path d="M3.9 6.9a6.5 6.5 0 0 1 9.2 0"/><circle cx="8.5" cy="9.9" r="1.2" fill="currentColor" stroke="none"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.6" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"/><path d="M25 4.5v4c.9-.3 1.5-1.1 1.5-2s-.6-1.7-1.5-2z" fill="currentColor" fill-opacity="0.45"/></svg>
  </div>
</div>  <!-- status bar 18:52: mid-session, 22 min after the planned 18:30 start -->


<main class="page">
  <header class="hdr">
    <div class="hdr-back"><i data-i="chevron-left"></i>训练</div>
    <div class="sync is-ok"><i data-i="circle-check"></i>2分前</div>
  </header>

  <!-- HERO: one segment per planned set (gaps group them by exercise, long ticks = exercise boundaries).
       Done = train, 5 pt; not yet = 1.5 pt track; the next set = faint train. Centre: split label, sets done of planned, session time. -->
  <section class="p-hero">
    <svg width="240" height="240" viewBox="0 0 240 240" fill="none" style="display:block;overflow:visible"><path d="M128.94 6.35 A114 114 0 0 1 156.78 12.1" stroke="var(--train)" stroke-width="5" stroke-linecap="round"/><path d="M164.95 15.24 A114 114 0 0 1 189.47 29.61" stroke="var(--train)" stroke-width="5" stroke-linecap="round"/><path d="M196.2 35.21 A114 114 0 0 1 214.81 56.69" stroke="var(--train)" stroke-width="5" stroke-linecap="round"/><path d="M219.38 64.15 A114 114 0 0 1 230.11 90.47" stroke="var(--train)" stroke-width="5" stroke-linecap="round"/><path d="M233.37 108.06 A114 114 0 0 1 232.8 136.48" stroke="var(--train)" stroke-width="5" stroke-linecap="round"/><path d="M231.21 145.08 A114 114 0 0 1 221.54 171.81" stroke="var(--train)" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/><path d="M217.27 179.45 A114 114 0 0 1 199.54 201.67" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M193.04 207.53 A114 114 0 0 1 169.12 222.88" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M152.42 229.29 A114 114 0 0 1 124.38 233.92" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M115.62 233.92 A114 114 0 0 1 87.58 229.29" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M79.29 226.48 A114 114 0 0 1 54.21 213.1" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M47.27 207.78 A114 114 0 0 1 27.81 187.06" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M18.46 171.81 A114 114 0 0 1 8.79 145.08" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M7.2 136.48 A114 114 0 0 1 6.63 108.06" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M7.88 99.4 A114 114 0 0 1 16.46 72.3" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M25.19 56.69 A114 114 0 0 1 43.8 35.21" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M50.53 29.61 A114 114 0 0 1 75.05 15.24" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><path d="M83.22 12.1 A114 114 0 0 1 111.06 6.35" stroke="var(--track)" stroke-width="1.5" stroke-linecap="round"/><line x1="216.36" y1="102.12" x2="226.19" y2="100.3" stroke="var(--tick-major)" stroke-width="1.5" stroke-linecap="round"/><line x1="155.16" y1="211.48" x2="158.74" y2="220.81" stroke="var(--tick-major)" stroke-width="1.5" stroke-linecap="round"/><line x1="36.47" y1="171.25" x2="27.95" y2="176.48" stroke="var(--tick-major)" stroke-width="1.5" stroke-linecap="round"/><line x1="34.48" y1="72.14" x2="25.76" y2="67.26" stroke="var(--tick-major)" stroke-width="1.5" stroke-linecap="round"/><line x1="120" y1="22" x2="120" y2="12" stroke="var(--tick-major)" stroke-width="1.5" stroke-linecap="round"/></svg>
    <div class="p-core">
      <div class="hero-label">上肢 A</div>
      <div class="p-num"><span class="t-hero">5</span><span class="of">/18<span>组</span></span></div>
      <div class="p-timer"><i data-i="timer"></i><span class="num">22:14</span></div>
    </div>
  </section>

  <!-- exercise rows: name | one dot per set (filled = done, train ring = next) | working weight x reps | chevron (= set editor sheet) -->
  <section class="p-list">
    <div class="p-ex p-done">
      <span class="p-nm">卧推</span>
      <span class="p-sd"><svg width="44" height="8" viewBox="0 0 44 8" fill="none" style="display:block"><circle cx="4" cy="4" r="4" fill="var(--train)"/><circle cx="16" cy="4" r="4" fill="var(--train)"/><circle cx="28" cy="4" r="4" fill="var(--train)"/><circle cx="40" cy="4" r="4" fill="var(--train)"/></svg></span>
      <span class="p-wt"><span class="t-row">60</span><span class="u">kg</span><span class="p-x">× 8</span></span>
      <i class="chev" data-i="chevron-right"></i>
    </div>
    <div class="p-ex">
      <span class="p-nm">哑铃划船</span>
      <span class="p-sd"><svg width="44" height="8" viewBox="0 0 44 8" fill="none" style="display:block"><circle cx="4" cy="4" r="4" fill="var(--train)"/><circle cx="16" cy="4" r="3.25" stroke="var(--train)" stroke-width="1.5"/><circle cx="28" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/><circle cx="40" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/></svg></span>
      <span class="p-wt"><span class="t-row">26</span><span class="u">kg</span><span class="p-x">× 10</span></span>
      <i class="chev" data-i="chevron-right"></i>
    </div>
    <div class="p-ex">
      <span class="p-nm">高位下拉</span>
      <span class="p-sd"><svg width="44" height="8" viewBox="0 0 44 8" fill="none" style="display:block"><circle cx="4" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/><circle cx="16" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/><circle cx="28" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/><circle cx="40" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/></svg></span>
      <span class="p-wt"><span class="t-row">55</span><span class="u">kg</span><span class="p-x">× 10</span></span>
      <i class="chev" data-i="chevron-right"></i>
    </div>
    <div class="p-ex">
      <span class="p-nm">侧平举</span>
      <span class="p-sd"><svg width="32" height="8" viewBox="0 0 32 8" fill="none" style="display:block"><circle cx="4" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/><circle cx="16" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/><circle cx="28" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/></svg></span>
      <span class="p-wt"><span class="t-row">8</span><span class="u">kg</span><span class="p-x">× 15</span></span>
      <i class="chev" data-i="chevron-right"></i>
    </div>
    <div class="p-ex">
      <span class="p-nm">二头弯举</span>
      <span class="p-sd"><svg width="32" height="8" viewBox="0 0 32 8" fill="none" style="display:block"><circle cx="4" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/><circle cx="16" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/><circle cx="28" cy="4" r="3.25" stroke="var(--track)" stroke-width="1.5"/></svg></span>
      <span class="p-wt"><span class="t-row">12</span><span class="u">kg</span><span class="p-x">× 12</span></span>
      <i class="chev" data-i="chevron-right"></i>
    </div>
  </section>
</main>

<!-- primary action, pinned above the Jarvis key (46 pt clear above the key; never under it) -->
<div class="btn-primary p-cta"><i data-i="check"></i>完成训练</div>
<div class="jarvis"><i data-i="orbit"></i></div>
<nav class="tabbar">
  <div class="tab on"><i data-i="circle-gauge"></i>今天</div>
  <div class="tab"><i data-i="activity"></i>身体</div>
  <div class="tab"><i data-i="users"></i>圈子</div>
  <div class="tab"><i data-i="user"></i>我</div>
</nav>
<div class="home-ind"></div>
<script src="kit.js"></script>
</body>
</html>
