<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>Jarvis · 更多 (快记)</title>
<link rel="stylesheet" href="kit.css">
<style>
.p-sheet{position:absolute;left:0;right:0;top:62px;bottom:0;border-radius:38px 38px 0 0;background:var(--sheet);z-index:70;padding:0 20px}
.p-hd{display:flex;align-items:center;height:44px;margin-top:9px}
.p-hd .t-title{display:flex;align-items:center;gap:6px}
.p-hd .icon-btn + .icon-btn{margin-left:12px}
/* Jarvis -> 记一餐 -> 更多 = every quick-log meal (the ring only holds the two most used). One subject: the list.
   Tap + = log that meal once, at once; the row then shows 已记到… with 撤销 (first row). Under each name: the macro split
   (protein / carbs / fat by energy, same mark as the 快记 face). Search and the meal filter narrow the list.
   Rhythm (y): sheet 62 -> header 71-115 -> search 127-171 -> filter 187-221 -> rows from 237, 60 each. */
.p-search{margin-top:12px;height:44px;border-radius:22px;background:var(--in-sheet);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:16px;color:var(--text2)}
.p-search i{font-size:18px}
.p-filter{margin-top:16px;display:flex}
.p-filter .seg{background:var(--in-sheet)}
.p-filter .seg span{padding:0 14px}
.p-list{margin-top:16px;border-top:1px solid var(--hair)}
.p-t{display:grid;grid-template-columns:1fr 86px 36px;align-items:center;column-gap:12px;height:60px;border-bottom:1px solid var(--hair)}
.p-t b{display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:500;margin-bottom:8px}
.p-t em{font-style:normal;font-size:12px;font-weight:500;color:var(--text2)}
.p-k{text-align:right;white-space:nowrap}
.p-add{width:36px;height:36px;border-radius:18px;background:var(--in-sheet);display:flex;align-items:center;justify-content:center;font-size:18px}
.p-add.done{background:var(--good-soft);color:var(--good)}
.p-undo{display:inline-flex;align-items:center;gap:4px;height:6px;font-size:12px;font-weight:600;color:var(--text)}
.p-undo i{font-size:13px}
</style>
</head>
<body>

  <div class="sb-time">9:41</div><div class="sb-island"></div>

    <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1.2 4.2a10.4 10.4 0 0 1 14.6 0"/><path d="M3.9 6.9a6.5 6.5 0 0 1 9.2 0"/><circle cx="8.5" cy="9.9" r="1.2" fill="currentColor" stroke="none"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.6" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"/><path d="M25 4.5v4c.9-.3 1.5-1.1 1.5-2s-.6-1.7-1.5-2z" fill="currentColor" fill-opacity="0.45"/></svg>

</div>

  </div>
</section>
