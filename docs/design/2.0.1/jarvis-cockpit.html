<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>Jarvis · cockpit interaction prototype</title>
<style>
/* Moving prototype of the Jarvis key in a cockpit / HUD style (2.0.1 proposal, not approved).
   Everything is drawn by one function of time, so a still or a film frame is reproducible:
     ?s=idle|open|listen|think&t=<ms in that state>   one still
     ?demo=1&t=<ms>                                   a frame of the scripted demo (idle -> open -> listen -> think -> idle)
     ?tone=ice (default) | ink                        ice = HUD accent with glow; ink = the app's own white + green, no glow
   No query = interactive: tap the key to open or close, tap the mic node to listen.
   Geometry only (circles, arcs, ticks, an inverted triangle); icons are Lucide (ISC) from kit.js. No third-party artwork. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:402px;height:874px;overflow:hidden;background:#000;font-family:system-ui;-webkit-font-smoothing:antialiased}
#bg{position:absolute;left:0;top:0;width:402px;height:874px}
#hud{position:absolute;left:0;top:0;width:402px;height:874px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
text{font-family:system-ui;user-select:none}
</style>
</head>
<body>
<img id="bg" src="01-today-dark.png" alt="">
<svg id="hud" viewBox="0 0 402 874" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="kit.js"></script>
<script>
var q=new URLSearchParams(location.search),TONE=q.get('tone')||'ice';
var A=TONE==='ink'?'#F4F4F6':'#8FDCFF',INK='#F4F4F6',DIMT='#8D8D94',GOOD='#72BF8E',GLOW=TONE!=='ink';
var CX=201,CY=751,R2=120;
var NODES=[{a:-72,i:'soup',l:'记一餐',o:2},{a:-36,i:'dumbbell',l:'记训练',o:1},{a:0,i:'mic',l:'说话',o:0},{a:36,i:'camera',l:'拍照',o:1},{a:72,i:'message-circle',l:'提问',o:2}];
var S={mode:'idle',hud:0,n:0,l:0,k:0,T:0,since:0};
function cl(x){return x<0?0:x>1?1:x}
function e(x){x=cl(x);return 1-Math.pow(1-x,3)}
function P(r,d){var a=d*Math.PI/180;return [CX+r*Math.sin(a),CY-r*Math.cos(a)]}
function f(n){return n.toFixed(2)}
function arc(r,a0,a1){if(a1-a0>=359.9)return 'M'+f(CX-r)+' '+CY+'a'+r+' '+r+' 0 1 0 '+(2*r)+' 0a'+r+' '+r+' 0 1 0 '+(-2*r)+' 0';
  var p=P(r,a0),b=P(r,a1);return 'M'+f(p[0])+' '+f(p[1])+'A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+f(b[0])+' '+f(b[1])}
function path(d,c,w,o,extra){return '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" opacity="'+f(o)+'" '+(extra||'')+'/>'}
function ln(r0,r1,d,c,w,o){var p=P(r0,d),b=P(r1,d);return '<line x1="'+f(p[0])+'" y1="'+f(p[1])+'" x2="'+f(b[0])+'" y2="'+f(b[1])+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" opacity="'+f(o)+'"/>'}
function tri(r,rot){var a=P(r,60+rot),b=P(r,180+rot),c=P(r,300+rot);return 'M'+f(a[0])+' '+f(a[1])+'L'+f(b[0])+' '+f(b[1])+'L'+f(c[0])+' '+f(c[1])+'Z'}
function txt(x,y,s,size,c,o,anchor,ls,w){return '<text x="'+f(x)+'" y="'+f(y)+'" font-size="'+size+'" fill="'+c+'" opacity="'+f(o)+'" text-anchor="'+(anchor||'middle')+'" letter-spacing="'+(ls||0)+'" font-weight="'+(w||500)+'">'+s+'</text>'}

function draw(){var T=S.T,h=S.hud,s='';
  // 1 scrim
  s+='<rect width="402" height="874" fill="#000" opacity="'+f(.82*e(h/300))+'"/>';
  var g='';
  // 3 HUD arcs (deploy from the top of the core outwards, both sides)
  if(h>0){
    var s1=180*e((h-60)/420);if(s1>1)g+=path(arc(58,-s1,s1),A,1,.35,'stroke-dasharray="2 5"');
    var s2=104*e((h-140)/460);if(s2>1)g+=path(arc(R2,-s2,s2),A,1,.32);
    var s3=84*e((h-240)/520);
    if(s3>1){var mk=62*Math.sin(T/1500);
      for(var d=-84;d<=84;d+=3){if(Math.abs(d)>s3)continue;var maj=(d%15===0),near=Math.abs(d-mk)<8;
        g+=ln(maj?170:174,180,d,near?INK:A,maj?1.4:1,near?.95:(maj?.7:.38))}
      var w=4*Math.sin(T/2100);
      g+=path(arc(194,-80+w,-22+w),A,2,.5*e((h-420)/300))+path(arc(194,22-w,80-w),A,2,.5*e((h-420)/300));
      g+=path(arc(200,-6,6),INK,2,.8*e((h-520)/300));}
    // scan line, once, while deploying
    var sc=(h-80)/520;if(sc>0&&sc<1){var y=CY-30-220*sc;g+='<line x1="24" x2="378" y1="'+f(y)+'" y2="'+f(y)+'" stroke="'+A+'" stroke-width="1" opacity="'+f(.35*(1-sc))+'"/>'}
    // readouts: the two readings of Today, as cockpit side data
    var ro=e((h-520)/300);
    if(ro>0){var st=S.l>.5?'在听':S.k>.5?'思考中':'就绪';
      g+=txt(CX,CY-226,'JARVIS',12,A,ro,'middle',5,600)+txt(CX,CY-208,st,11,DIMT,ro,'middle',2);
      g+=path('M24 512v-8h8',A,1,.6*ro)+txt(30,524,'恢复',10,DIMT,ro,'start',1)+txt(30,546,'82',20,INK,ro,'start',0,300);
      g+=path('M378 512v-8h-8',A,1,.6*ro)+txt(372,524,'负荷',10,DIMT,ro,'end',1)+txt(372,546,'2.8',20,INK,ro,'end',0,300);}
  }
  // 4 nodes: spoke, ring drawn by sweep, brackets, icon, label
  if(S.n>0.01&&h>0){NODES.forEach(function(n,i){var p=e((h-300-n.o*80)/320)*S.n;if(p<=0)return;
    var c=P(R2,n.a),hot=(S.flash===i);
    g+=ln(36,36+58*p,n.a,A,1,.4*p);
    var C=2*Math.PI*25;
    g+='<circle cx="'+f(c[0])+'" cy="'+f(c[1])+'" r="25" fill="'+(hot?A:'#0A0C0F')+'" fill-opacity="'+f(hot?.9:.92*p)+'" stroke="'+A+'" stroke-width="1.2" opacity="'+f(cl(p*1.5))+'" stroke-dasharray="'+f(C*p)+' '+f(C)+'" transform="rotate(-90 '+f(c[0])+' '+f(c[1])+')"/>';
    var br=T/50+i*40;
    g+='<g transform="translate('+f(c[0]-CX)+' '+f(c[1]-CY)+')" opacity="'+f(.75*p)+'">'+path(arc(30,br,br+38),A,1.4,1)+path(arc(30,br+180,br+218),A,1.4,1)+'</g>';
    var ic=window.LUCIDE[n.i];
    g+='<g transform="translate('+f(c[0]-11)+' '+f(c[1]-11)+') scale('+f(22/24)+')" fill="none" stroke="'+(hot?'#000':INK)+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="'+f(p*p)+'">'+ic.d+'</g>';
    var lp=Math.abs(n.a)>60?[c[0],c[1]+44]:P(R2+37,n.a);g+=txt(lp[0],lp[1]+4,n.l,11,INK,.85*p*p,'middle',.5)});}
  // 5 listening: radial level bars round the core
  if(S.l>0.01){for(var i=0;i<56;i++){var v=Math.abs(Math.sin(i*1.7+T/95)*Math.sin(i*.37+T/270))+.25*Math.abs(Math.sin(i*.9-T/160));
    g+=ln(40,40+(4+24*v)*S.l,i*360/56,A,2,.85*S.l)}}
  // 6 thinking: three arcs at three speeds
  if(S.k>0.01){var a1=T*.21,a2=-T*.33,a3=T*.5;
    g+=path(arc(40,a1,a1+110),A,2,.9*S.k)+path(arc(40,a1+180,a1+290),A,2,.9*S.k)+path(arc(48,a2,a2+70),A,1.5,.7*S.k)+path(arc(48,a2+180,a2+250),A,1.5,.7*S.k)+path(arc(56,a3,a3+40),INK,1.5,.6*S.k);}
  // 2 the core key
  var pu=h/350;if(pu>0&&pu<1)g+='<circle cx="'+CX+'" cy="'+CY+'" r="'+f(29+30*e(pu))+'" fill="none" stroke="'+A+'" stroke-width="1.5" opacity="'+f(.8*(1-pu))+'"/>';
  var on=cl(h/300),sp=1+5*S.k+1.5*on;
  g+='<circle cx="'+CX+'" cy="'+CY+'" r="29" fill="#08090B" stroke="'+A+'" stroke-width="1" stroke-opacity="'+f(.45+.45*on)+'"/>';
  var ra=T*.02*sp;for(var j=0;j<24;j++)g+=ln(22,j%6===0?26.5:25,ra+j*15,A,1,j%6===0?.95:.5);
  var rb=-T*.035*sp;for(var m=0;m<3;m++)g+=path(arc(17.5,rb+m*120,rb+m*120+84),A,1.5,.85);
  var br2=.6+.4*Math.sin(T/700);
  g+='<path d="'+tri(11.5,0)+'" fill="none" stroke="'+INK+'" stroke-width="1.6" stroke-linejoin="round"/>';
  g+='<path d="'+tri(4.6,0)+'" fill="'+(TONE==='ink'?GOOD:A)+'" opacity="'+f(br2)+'" stroke="'+(TONE==='ink'?GOOD:A)+'" stroke-width="1" stroke-linejoin="round"/>';
  s+='<g'+(GLOW?' style="filter:drop-shadow(0 0 5px '+A+'99) drop-shadow(0 0 14px '+A+'44)"':'')+'>'+g+'</g>';
  document.getElementById('hud').innerHTML=s}

function step(dt){S.T+=dt;S.since+=dt;var m=S.mode,up=m!=='idle';
  S.hud=up?Math.min(900,S.hud+dt):Math.max(0,S.hud-dt*2.6);
  function mv(v,on){return cl(v+(on?dt:-dt)/260)}
  S.n=mv(S.n,m==='open');S.l=mv(S.l,m==='listen');S.k=mv(S.k,m==='think');
  if(m==='listen'&&S.since>2600&&S.auto)set('think');else if(m==='think'&&S.since>2200&&S.auto)set('idle');
  if(S.flash!=null&&S.since>220&&m==='open'){var i=S.flash;S.flash=null;if(NODES[i].i==='mic'){S.auto=true;set('listen')}else set('idle')}}
function set(m){S.mode=m;S.since=0}

var still=q.get('s'),t=+q.get('t')||0;
if(q.get('demo')){ // scripted film: idle 0.7 s -> open -> (2.9 s) tap mic -> listen -> think -> idle
  var ev=[[700,function(){set('open')}],[2900,function(){S.flash=2;S.since=0}]],k=0;
  for(var x=0;x<t;x+=16){while(k<ev.length&&x>=ev[k][0]){ev[k][1]();k++}step(16)}draw()}
else if(still){S.T=4000+t;S.mode=still;if(still!=='idle'){S.hud=Math.min(900,still==='open'?t:900)}
  S.n=still==='open'?1:0;S.l=still==='listen'?1:0;S.k=still==='think'?1:0;draw()}
else{var last=performance.now();(function loop(now){step(Math.min(50,now-last));last=now;draw();requestAnimationFrame(loop)})(last);
  document.getElementById('hud').addEventListener('click',function(ev){var r=this.getBoundingClientRect(),x=(ev.clientX-r.left)*402/r.width,y=(ev.clientY-r.top)*874/r.height;
    if(Math.hypot(x-CX,y-CY)<34){S.auto=false;set(S.mode==='idle'?'open':'idle');return}
    if(S.mode==='open'){for(var i=0;i<NODES.length;i++){var c=P(R2,NODES[i].a);if(Math.hypot(x-c[0],y-c[1])<30){S.flash=i;S.since=0;return}}set('idle')}
    else if(S.mode!=='idle')set('idle')})}
</script>
</body>
</html>
