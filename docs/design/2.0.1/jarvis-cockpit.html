<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<title>Jarvis · cockpit interaction prototype</title>
<style>
/* Moving prototype of the Jarvis key in a cockpit style, second pass: same style, far fewer lines (2.0.1 proposal).
   Idle is key K1 (one inverted triangle on the glass key). Opened: one arc and five nodes, nothing else.
   Everything is drawn by one function of time, so a still or a film frame is reproducible:
     ?s=idle|open|listen|think&t=<ms in that state>   one still
     ?demo=1&t=<ms>                                   a frame of the scripted demo (idle -> open -> listen -> think -> idle)
     ?tone=ice (default) | ink                        ice = accent with a soft glow; ink = white, no glow
   No query = interactive: tap the key to open or close, tap the mic node to listen.
   Geometry only (circle, arc, inverted triangle); icons are Lucide (ISC). No third-party artwork. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:402px;height:874px;overflow:hidden;background:#000;font-family:system-ui;-webkit-font-smoothing:antialiased}
#bg{position:absolute;left:0;top:0;width:402px;height:874px}
#hud{position:absolute;left:0;top:0;width:402px;height:874px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
text{font-family:system-ui;user-select:none}
</style>
</head>
<body>
<img id="bg" src="01-today-dark.png" alt="">
<svg id="hud" viewBox="0 0 402 874" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="kit.js"></script>
<script>
var q=new URLSearchParams(location.search),TONE=q.get('tone')||'ice';
var A=TONE==='ink'?'#F4F4F6':'#8FDCFF',INK='#F4F4F6',GLOW=TONE!=='ink';
var CX=201,CY=751,R2=118;
var TRI="M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"; // Lucide "triangle" (ISC), drawn rotated 180 deg
var NODES=[{a:-72,i:'soup',l:'记一餐',o:2},{a:-36,i:'dumbbell',l:'记训练',o:1},{a:0,i:'mic',l:'说话',o:0},{a:36,i:'camera',l:'拍照',o:1},{a:72,i:'message-circle',l:'提问',o:2}];
var S={mode:'idle',hud:0,n:0,l:0,k:0,T:0,since:0,tl:2600,tk:2200};
function cl(x){return x<0?0:x>1?1:x}
function e(x){x=cl(x);return 1-Math.pow(1-x,3)}
function sm(x){x=cl(x);return x*x*(3-2*x)}
function back(x){x=cl(x);var c=1.25;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}
function P(r,d){var a=d*Math.PI/180;return [CX+r*Math.sin(a),CY-r*Math.cos(a)]}
function f(n){return n.toFixed(2)}
function arc(r,a0,a1){var p=P(r,a0),b=P(r,a1);return 'M'+f(p[0])+' '+f(p[1])+'A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+f(b[0])+' '+f(b[1])}
function path(d,c,w,o){return '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" opacity="'+f(o)+'"/>'}
function txt(x,y,s,size,c,o){return '<text x="'+f(x)+'" y="'+f(y)+'" font-size="'+size+'" fill="'+c+'" opacity="'+f(o)+'" text-anchor="middle" letter-spacing=".5" font-weight="500">'+s+'</text>'}
function wave(r0,amp,ph){var d='';for(var i=0;i<=120;i++){var th=i*3,x=th*Math.PI/180,r=r0+amp*(Math.sin(3*x+ph)*Math.sin(ph*.7)+.6*Math.sin(5*x-ph*1.4)),p=P(r,th);d+=(i?'L':'M')+f(p[0])+' '+f(p[1])}return d+'Z'}

function draw(){var T=S.T,h=S.hud,s='',g='',on=sm(h/260);
  s+='<rect width="402" height="874" fill="#000" opacity="'+f(.84*on)+'"/>';
  // one arc: the rail the nodes sit on
  var n=S.n,sw=92*e((h-60)/520)*sm(n);
  if(sw>1)g+=path(arc(+f(R2*(.5+.5*sm(n))),-sw,sw),A,1,.28*sm(n*2-1));
  // nodes fly out of the core, centre first
  if(n>0.01&&h>0){NODES.forEach(function(nd,i){var p=cl((h-90-nd.o*70)/420),k=back(p)*sm(n),o=cl(p*2.2)*sm(n);if(o<=0)return;
    var c=P(R2*k,nd.a),hot=(S.flash===i);
    g+='<circle cx="'+f(c[0])+'" cy="'+f(c[1])+'" r="'+f(25*(.6+.4*cl(k)))+'" fill="'+(hot?A:'#0B0D10')+'" stroke="'+A+'" stroke-width="1" stroke-opacity=".8" opacity="'+f(o)+'"/>';
    g+='<g transform="translate('+f(c[0]-11)+' '+f(c[1]-11)+') scale('+f(22/24)+')" fill="none" stroke="'+(hot?'#000':INK)+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="'+f(o)+'">'+window.LUCIDE[nd.i].d+'</g>';
    var lo=sm((p-.55)/.45)*sm(n*4-3),lp=Math.abs(nd.a)>60?[c[0],c[1]+44]:P(R2*k+37,nd.a);
    if(lo>0)g+=txt(lp[0],lp[1]+4,nd.l,11,INK,.8*lo)});}
  // listening: one soft ring that moves with the voice
  if(S.l>0.01){var l=sm(S.l);g+=path(wave(40,5.5*l,T/260),A,1.6,.95*l)+path(wave(47,4*l,-T/340+2),A,1,.4*l)}
  // thinking: one arc going round
  if(S.k>0.01){var k2=sm(S.k),a1=T*.36;g+='<circle cx="'+CX+'" cy="'+CY+'" r="40" fill="none" stroke="'+A+'" stroke-width="1" opacity="'+f(.22*k2)+'"/>'+path(arc(40,a1,a1+96),A,2,.95*k2)}
  // press feedback: one ring leaving the key
  var pu=h/420;if(pu>0&&pu<1)g+='<circle cx="'+CX+'" cy="'+CY+'" r="'+f(29+34*e(pu))+'" fill="none" stroke="'+A+'" stroke-width="1.2" opacity="'+f(.7*(1-pu)*(1-pu))+'"/>';
  // the key: K1, one inverted triangle on the glass key
  g+='<circle cx="'+CX+'" cy="'+CY+'" r="29" fill="rgb(24,24,27)" stroke="'+(on>0?A:'#FFFFFF')+'" stroke-width="1" stroke-opacity="'+f(.14+.66*on)+'"/>';
  var br=1+.035*Math.sin(T/900)*on;
  g+='<g transform="translate('+CX+' '+CY+') rotate(180) scale('+f(1.08*br)+') translate(-12 -14.4)"><path d="'+TRI+'" fill="none" stroke="'+INK+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>';
  var ga=Math.round(on*110+16).toString(16);
  s+='<g'+(GLOW&&on>0?' style="filter:drop-shadow(0 0 6px '+A+ga+')"':'')+'>'+g+'</g>';
  document.getElementById('hud').innerHTML=s}

function step(dt){S.T+=dt;S.since+=dt;var m=S.mode,up=m!=='idle';
  S.hud=up?Math.min(900,S.hud+dt):Math.max(0,S.hud-dt*2.4);
  function mv(v,on,ms){return cl(v+(on?dt:-dt)/ms)}
  S.n=mv(S.n,m==='open',300);S.l=mv(S.l,m==='listen',380);S.k=mv(S.k,m==='think',380);
  if(m==='listen'&&S.since>S.tl&&S.auto)set('think');else if(m==='think'&&S.since>S.tk&&S.auto)set('idle');
  if(S.flash!=null&&S.since>200&&m==='open'){var i=S.flash;S.flash=null;if(NODES[i].i==='mic'){S.auto=true;set('listen')}else set('idle')}}
function set(m){S.mode=m;S.since=0}

var still=q.get('s'),t=+q.get('t')||0;
if(q.get('demo')){ // scripted film: idle 0.5 s -> open -> (2.2 s) tap mic -> listen 2 s -> think 1.6 s -> idle
  S.tl=2000;S.tk=1600;var ev=[[500,function(){set('open')}],[2200,function(){S.flash=2;S.since=0}]],k=0,dt=1000/120;
  for(var x=0;x<t;x+=dt){while(k<ev.length&&x>=ev[k][0]){ev[k][1]();k++}step(dt)}draw()}
else if(still){S.T=4000+t;S.mode=still;if(still!=='idle'){S.hud=Math.min(900,still==='open'?t:900)}
  S.n=still==='open'?1:0;S.l=still==='listen'?1:0;S.k=still==='think'?1:0;draw()}
else{var last=performance.now();(function loop(now){step(Math.min(34,now-last));last=now;draw();requestAnimationFrame(loop)})(last);
  document.getElementById('hud').addEventListener('click',function(ev){var r=this.getBoundingClientRect(),x=(ev.clientX-r.left)*402/r.width,y=(ev.clientY-r.top)*874/r.height;
    if(Math.hypot(x-CX,y-CY)<34){S.auto=false;set(S.mode==='idle'?'open':'idle');return}
    if(S.mode==='open'){for(var i=0;i<NODES.length;i++){var c=P(R2,NODES[i].a);if(Math.hypot(x-c[0],y-c[1])<30){S.flash=i;S.since=0;return}}set('idle')}
    else if(S.mode!=='idle')set('idle')})}
</script>
</body>
</html>
