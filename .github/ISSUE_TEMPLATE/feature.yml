name: Feature request
description: Suggest an idea or a new platform / data source
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Maintainers close an issue only with a comment saying what was fixed, in which PR / commit, how it was verified
        and what is left open (CONTRIBUTING.md, "Maintenance rules").
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which part would change? A maintainer adds the matching `platform:*` label.
      multiple: true
      options:
        - iOS app
        - Today page (web, frozen)
        - Server (Body Engine, AI / MCP, deployment)
        - iOS Shortcut (being retired)
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Development is iOS native only (apps/ios); Android, HarmonyOS and the Flutter app are not planned, and the web Today page is frozen.
  - type: input
    id: third_party
    attributes:
      label: Third-party terms
      description: Terms of service, deprecation notices or trademarks this depends on (an API, a store policy, a name or logo), with links. Write "none" if there are none.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
