# CI for pull requests and main. Job names are the required status checks of the `main` branch protection
# (tools/public/RELEASE.md, section 2). No secrets are needed: the database is a throwaway service container.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  body-engine:
    name: Body Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: body
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: body_test_scores   # test_scores_db.py expects this database to exist; the others create their own
          TZ: Australia/Sydney            # same as compose.yaml: some tests still assume this server / process time zone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U body"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.12.19"
      - name: Database password file
        run: printf '%s' 'ci-only-not-a-secret' > "$RUNNER_TEMP/body_db_password"
      - name: pytest
        working-directory: body_engine
        env:
          BODY_DB_HOST: 127.0.0.1
          BODY_DB_PORT: "5432"
          BODY_DB_USER: body
          BODY_DB_PASSWORD_FILE: ${{ runner.temp }}/body_db_password
          TZ: Australia/Sydney
        shell: bash
        # -rs lists skipped tests; fail if the database tests were skipped because Postgres was unreachable
        run: |
          uv run --locked pytest -q -rs | tee "$RUNNER_TEMP/pytest.txt"
          ! grep -qE "cannot connect to Postgres|unreachable" "$RUNNER_TEMP/pytest.txt"

  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: py_compile (all tracked .py)
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile
      - name: bash -n (all tracked .sh)
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n

  flutter:
    name: Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/watch2whoop
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.9.1
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # config/defaults.json (your own server address) is git-ignored and not needed: the defaults compile to empty values
      - run: flutter pub get
      - run: flutter test
