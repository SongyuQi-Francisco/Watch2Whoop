# CI for pull requests and main. Job names are the required status checks of the `main` branch protection
# (tools/public/RELEASE.md, section 2). No secrets are needed: the database is a throwaway service container.
#
# Path filters (docs/apps.md, section 5): on pull requests the `changes` job decides which jobs are needed. Jobs are
# skipped with a job-level `if`, and a skipped job reports success, so the required checks still pass. Do not move the
# filter to `on: pull_request: paths:` — a workflow that does not start leaves required checks pending forever.
# Pushes to main, changes to this workflow and any failure of `changes` run everything.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flutter app (its job keeps the required check name "Flutter tests").
  FLUTTER_APP: apps/watch2whoop
  # Further client apps, tested by the "Other apps" job. enabled: false = placeholder (the directory does not exist yet).
  # To add one: create the directory, set enabled: true and add a step for its `kind` in the `other-apps` job.
  OTHER_APPS: >-
    [{"id": "harmony", "path": "apps/harmony", "kind": "harmony", "enabled": false}]

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      flutter: ${{ steps.filter.outputs.flutter }}
      other_apps: ${{ steps.filter.outputs.other_apps }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -uo pipefail
          all() {  # run everything
            echo "$1 → running all jobs"
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            echo "other_apps=$(jq -c '[.[] | select(.enabled)]' <<< "$OTHER_APPS")" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT" = pull_request ] || all "event $EVENT"
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" \
            || all "could not list the changed files"
          [ -n "$files" ] || all "no changed files listed"
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          grep -qx '\.github/workflows/ci\.yml' <<< "$files" && all "workflow changed"
          # Server = anything outside apps/ (docs included: tests compare some documents with server copies;
          # packages/ included: Body Engine depends on packages/openbodyscore).
          # Also the app's HealthKit type registries: server tests compare them with rawdata/hk_types.py.
          if grep -qv '^apps/' <<< "$files" \
             || grep -qxE 'apps/watch2whoop/(lib/src/hk_types\.dart|assets/healthkit_types\.json)' <<< "$files"; then
            server=true; else server=false; fi
          if grep -q "^$FLUTTER_APP/" <<< "$files"; then flutter=true; else flutter=false; fi
          other="$(jq -c --arg files "$files" \
            '[.[] | select(.enabled) | . as $a | select($files | split("\n") | any(startswith($a.path + "/")))]' \
            <<< "$OTHER_APPS")"
          echo "server=$server flutter=$flutter other_apps=$other"
          { echo "server=$server"; echo "flutter=$flutter"; echo "other_apps=$other"; } >> "$GITHUB_OUTPUT"

  body-engine:
    name: Body Engine tests
    needs: changes
    # !cancelled(): still run when `changes` failed (then its outputs are empty), so a broken filter never skips tests
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: body
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: body_test_scores   # test_scores_db.py expects this database to exist; the others create their own
          TZ: Australia/Sydney            # same as compose.yaml: some tests still assume this server / process time zone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U body"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.19"
      - name: Database password file
        run: printf '%s' 'ci-only-not-a-secret' > "$RUNNER_TEMP/body_db_password"
      # The scoring algorithms on their own (issue #115): own lock, no database, no Body Engine. Part of this job so the
      # required check names stay the same.
      - name: openbodyscore tests
        working-directory: packages/openbodyscore
        run: uv run --locked pytest -q
      - name: pytest
        working-directory: body_engine
        env:
          BODY_DB_HOST: 127.0.0.1
          BODY_DB_PORT: "5432"
          BODY_DB_USER: body
          BODY_DB_PASSWORD_FILE: ${{ runner.temp }}/body_db_password
          TZ: Australia/Sydney
        shell: bash
        # -rs lists skipped tests; fail if the database tests were skipped because Postgres was unreachable
        run: |
          uv run --locked pytest -q -rs | tee "$RUNNER_TEMP/pytest.txt"
          ! grep -qE "cannot connect to Postgres|unreachable" "$RUNNER_TEMP/pytest.txt"

  syntax:
    name: Syntax checks   # always runs: it covers every tracked .py / .sh / .js and takes seconds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: py_compile (all tracked .py)
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile
      - name: bash -n (all tracked .sh)
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The Today page has no build step, so a JS syntax error ships as is and blanks the whole page (#198 → #207)
      - name: node --check (all tracked .js)
        run: git ls-files -z '*.js' | xargs -0 -r -n1 node --check
      - name: example app config points at example.com, server lock off
        run: python tools/check_example_config.py
      # Generic rules only (no private word list here): e-mails, public IPs, tailnet names, token-shaped strings,
      # licences, and health numbers that look like a real person's. The maintainer's pre-push hook adds the private lists.
      - name: public-repo privacy scan (tracked files)
        run: |
          tree="$(mktemp -d)"
          git archive HEAD | tar -x -C "$tree"
          python tools/export_public.py --scan "$tree"

  flutter:
    name: Flutter tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.flutter == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_APP }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # config/defaults.json (your own server address) is git-ignored and not needed: the defaults compile to empty values
      - run: flutter pub get
      - run: flutter test

  # iOS native pods (#295 A4): `pod install` from pubspec.lock must give exactly the committed ios/Podfile.lock, so a
  # tag builds the same pods every time (OpenWearablesHealthSDK ~> 0.15.0 cannot float). Not a required check of main.
  # Note: plugin pods carry their podspec's version (e.g. open_wearables_health_sdk 0.0.25 says 0.0.24), not pub's.
  ios-pods:
    name: iOS Podfile.lock
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.flutter == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_APP }}
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter precache --ios
      - run: flutter pub get
      - run: cd ios && pod install
      - name: Podfile.lock unchanged (otherwise run `pod install` and commit ios/Podfile.lock)
        run: git diff --exit-code ios/Podfile.lock

  # Android build check (#253): the release APK, signed with the runner's debug key (no secrets on pull requests), kept
  # as an artifact of the run for a test phone. Not a required check of main yet.
  android:
    name: Android APK
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.flutter == 'true') }}
    uses: ./.github/workflows/android-apk.yml

  other-apps:
    name: Other apps
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.other_apps != '[]' && needs.changes.outputs.other_apps != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.other_apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app.path }}
    steps:
      - uses: actions/checkout@v7
      - name: HarmonyOS (placeholder)
        if: matrix.app.kind == 'harmony'
        run: |
          echo "No HarmonyOS toolchain in CI yet: add the build / test steps for ${{ matrix.app.path }} here (docs/apps.md)."
          exit 1
