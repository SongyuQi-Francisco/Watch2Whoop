[project]
name = "openbodyscore"   # working name; the maintainer confirms the final name before any release (docs/oss-extraction-plan.md)
version = "0.1.0"
description = "Wearable recovery, sleep, strain, stress and body-age scores from heart-rate, HRV and sleep data. Pure Python, no dependencies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Private :: Do Not Upload",   # not published yet (issue #115); remove when the release checklist is done
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbodyscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
