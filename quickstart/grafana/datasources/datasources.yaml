# Quick Start Grafana data sources: the two databases through their read-only grafana_ro roles
# (passwords generated by quickstart/run.py). SparkyFitness weight panels need the Infinity plugin and stay empty here.
apiVersion: 1
prune: true
datasources:
  - name: Body Engine
    uid: body-engine
    type: grafana-postgresql-datasource
    url: body-db:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData: {database: body, sslmode: disable, postgresVersion: 1700, timescaledb: false}
    secureJsonData:
      password: $__file{/run/secrets/grafana_ro_body_password}
  - name: Open Wearables
    uid: open-wearables
    type: grafana-postgresql-datasource
    url: ow-db:5432
    user: grafana_ro
    editable: false
    jsonData: {database: open-wearables, sslmode: disable, postgresVersion: 1800, timescaledb: false}
    secureJsonData:
      password: $__file{/run/secrets/grafana_ro_ow_password}
