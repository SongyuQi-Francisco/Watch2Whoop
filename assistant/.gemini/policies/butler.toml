# Body butler policy for Gemini CLI (assistant/.gemini/policies/butler.toml).
# Mirrors assistant/.claude/settings.json: allow all body-engine MCP tools, ask before destructive undo/delete tools
# (or deny in headless non-interactive mode), and deny all built-in shell/filesystem/web tools.

[[rule]]
mcpName = "body-engine"
toolName = "*"
decision = "allow"
priority = 50

[[rule]]
mcpName = "body-engine"
toolName = [
  "undo_sparky_entry",
  "undo_meal_log",
  "delete_journal_entry",
  "delete_lab_results",
  "delete_observation",
  "delete_supplement",
]
decision = "ask_user"
priority = 100
interactive = true

[[rule]]
mcpName = "body-engine"
toolName = [
  "undo_sparky_entry",
  "undo_meal_log",
  "delete_journal_entry",
  "delete_lab_results",
  "delete_observation",
  "delete_supplement",
]
decision = "deny"
priority = 100
interactive = false
denyMessage = "Destructive undo/delete requires interactive confirmation."

[[rule]]
toolName = [
  "run_shell_command",
  "write_file",
  "replace",
  "read_file",
  "read_many_files",
  "list_directory",
  "glob",
  "grep_search",
  "web_fetch",
  "google_web_search",
  "save_memory",
]
decision = "deny"
priority = 200
