# XcodeGen spec of the native iOS app (#340 N0, docs/ios-native-app.md). The .xcodeproj is generated, never committed:
#   cd apps/ios && xcodegen generate
# CI pins XcodeGen 2.46.0 (.github/workflows/ci.yml, job "iOS native").
name: Watch2Whoop
options:
  bundleIdPrefix: org.watch2whoop
  deploymentTarget:
    iOS: "16.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: zh-Hans

configFiles:
  Debug: Config/Watch2Whoop.xcconfig
  Release: Config/Watch2Whoop.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  # Lets SyncEngine.swift / RawSync.swift / Backfill.swift stay byte-for-byte copies of the Flutter app's files while
  # A2–A4 still change them there (scripts/sync_flutter_sources.sh). Removed when N8 gives them a native API.
  FlutterShim:
    path: Packages/FlutterShim

targets:
  Watch2Whoop:
    type: application
    platform: iOS
    sources:
      - path: Watch2Whoop
        excludes:
          - "**/*.md"
          - "PrivacyInfo.xcprivacy"
      # Shared with the Apple Watch app (plain Foundation: plan, events, set session, queue; docs/watch-app-plan.md 4.1)
      - path: WatchShared
      # The privacy manifest (required-reason APIs, collected data types; App Store submission)
      - path: Watch2Whoop/PrivacyInfo.xcprivacy
        buildPhase: resources
      # N1's scoring bundle (global OpenBodyScore), run in JavaScriptCore by Algorithms/OpenBodyScoreRuntime.swift. Built
      # into the app from its one copy in git; N2 adds the signed download that replaces it at run time.
      - path: ../../packages/openbodyscore-js/dist/openbodyscore.js
        buildPhase: resources
      # N5's muscle load map: the Today page's body drawings (paths from @mjcdev/react-body-highlighter, MIT), read by
      # Features/Record/MuscleMap.swift; one copy in git, so the app and the page never draw different bodies.
      - path: ../../body_engine/src/body_engine/web/static/muscle-body-data.js
        buildPhase: resources
    info:
      path: Watch2Whoop/Info.plist
      properties:
        CFBundleDisplayName: $(W2W_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [zh-Hans, en]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing, remote-notification]
        # Default server host for the sign-in screen (git-ignored Watch2Whoop.local.xcconfig; empty = ask)
        W2WDefaultHost: $(W2W_DEFAULT_HOST)
        # Fixed address of the privacy policy / terms pages (git-ignored local xcconfig; empty = the signed-in server's /legal/)
        W2WLegalBaseURL: $(W2W_LEGAL_BASE_URL)
        BGTaskSchedulerPermittedIdentifiers:
          - watch2whoop.sync.backfill
          - watch2whoop.sync.refresh
          - watch2whoop.sync.process
          - watch2whoop.history.download
        CFBundleURLTypes:
          - CFBundleURLName: watch2whoop
            CFBundleURLSchemes: [watch2whoop]
        # Permission texts: English here and in en.lproj, Chinese in zh-Hans.lproj/InfoPlist.strings (keep the three equal in
        # meaning). Data goes to the person's account on the Watch2Whoop server; an AI sees it only through Jarvis.
        NSHealthShareUsageDescription: "Watch2Whoop reads the Health data you allow (such as heart rate, HRV and beat-to-beat intervals, ECGs, sleep, workouts, steps and energy) to calculate your recovery, sleep and strain, and syncs it to your account on the Watch2Whoop server. It is never used for advertising or sold. An AI reads it only when you use Jarvis."
        NSHealthUpdateUsageDescription: "Watch2Whoop does not write your data to Health. Only developer test builds add sample data in the simulator."
        NSCameraUsageDescription: "Used to scan your setup QR code and, when you choose to, to take a photo for Jarvis or for your profile picture. Photos go to your account on the Watch2Whoop server, and to your AI only when you send them to Jarvis."
        NSMicrophoneUsageDescription: "Used only while you hold the mic button to talk to Jarvis. Your voice is turned into text on this iPhone or on the Watch2Whoop server; no recording is kept."
        NSSpeechRecognitionUsageDescription: "Used only while you talk to Jarvis: Apple's on-device recognition turns what you say into text on this iPhone."
    entitlements:
      path: Watch2Whoop/Watch2Whoop.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Push (#175): development here; exporting for App Store Connect / TestFlight signs it as production
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(W2W_BUNDLE_ID)
        PRODUCT_NAME: Watch2Whoop
        DEVELOPMENT_TEAM: $(W2W_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: $(W2W_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(W2W_BUILD_NUMBER)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: GRDB
      - package: FlutterShim
        product: Flutter
      - sdk: HealthKit.framework
      - sdk: JavaScriptCore.framework
      # The Apple Watch app ships inside the iPhone app (owner 2026-11-15: it ships with 2.1.0): XcodeGen copies it
      # into Watch/ ("Embed Watch Content"), so one TestFlight upload carries both.
      - target: Watch2WhoopWatch

  Watch2WhoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Watch2WhoopTests
      # 2.0.0 M1: the derivation's cross-language golden file (inputs + the server's expected rows), LocalDeriveTests.swift
      - path: ../../packages/openbodyscore-js/test/golden/derive.json
        buildPhase: resources
      # 2.0.0 M1c: the workouts' golden file (the `new_york` inputs + the server's expected rows), LocalWorkoutsTests.swift
      - path: ../../packages/openbodyscore-js/test/golden/workouts.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.watch2whoop.native.tests
        DEVELOPMENT_TEAM: $(W2W_TEAM_ID)
    # GRDB comes with the host app (TEST_HOST); linking it again here would load two copies.
    dependencies:
      - target: Watch2Whoop

  # Apple Watch app, phase 1 (docs/watch-app-plan.md 5: logging sets), embedded in the iPhone app above and uploaded with
  # it. Bundle ID = the iPhone app's + ".watchkitapp"; version and build number come from the same xcconfig as the
  # iPhone app (they must be equal for App Store Connect). Release steps: apps/ios/Watch2WhoopWatch/README.md.
  Watch2WhoopWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch2WhoopWatch
        excludes:
          - "**/*.md"
      - path: WatchShared
      # tr("中文", "English") and the language choice, the same file as the iPhone app's
      - path: Watch2Whoop/Localization/I18n.swift
      # the complications' views, drawn by the Debug gallery too (FaceGallery.swift)
      - path: Watch2WhoopWatchWidgets/FaceViews.swift
    info:
      path: Watch2WhoopWatch/Info.plist
      properties:
        CFBundleDisplayName: $(W2W_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [zh-Hans, en]
        WKApplication: true
        # The App Group the app shares with its watch-face complications (WatchShared/WatchStore.swift `shared`)
        W2WAppGroup: $(W2W_APP_GROUP)
        WKCompanionAppBundleIdentifier: $(W2W_BUNDLE_ID)
        # A companion app: it needs the iPhone app (plan, hand-over of the sets), so it is not offered on its own.
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        # English here and in en.lproj, Chinese in zh-Hans.lproj/InfoPlist.strings (keep the three equal in meaning)
        NSHealthShareUsageDescription: "Watch2Whoop reads your heart rate during a workout you start on this watch, to show it between sets."
        NSHealthUpdateUsageDescription: "Watch2Whoop saves the strength workout you record on this watch to Health, so its heart rate and energy count in your strain."
    entitlements:
      path: Watch2WhoopWatch/Watch2WhoopWatch.entitlements
      properties:
        # shared with the complications (Watch2WhoopWatchWidgets): the store they read
        com.apple.security.application-groups: [$(W2W_APP_GROUP)]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(W2W_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: Watch2WhoopWatch
        DEVELOPMENT_TEAM: $(W2W_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: $(W2W_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(W2W_BUILD_NUMBER)
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # embedded: only the iPhone app is installed / archived, the watch app travels inside it
        SKIP_INSTALL: YES
    dependencies:
      - sdk: HealthKit.framework
      # The watch-face complications, embedded in the watch app (PlugIns/)
      - target: Watch2WhoopWatchWidgets

  # Watch-face complications of 2.1.0 (docs/watch-app-plan.md 2.5): a WidgetKit extension inside the watch app. It reads
  # the App Group store the watch app writes and draws it with the shared rules (WatchShared/WatchFace.swift). Bundle ID
  # = the watch app's + ".widgets"; version and build number from the same xcconfig. Release steps:
  # apps/ios/Watch2WhoopWatch/README.md 「Complications」.
  Watch2WhoopWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch2WhoopWatchWidgets
        excludes:
          - "**/*.md"
      - path: WatchShared
      - path: Watch2Whoop/Localization/I18n.swift
      # the watch's colours and its dial number, so the face draws exactly like the app
      - path: Watch2WhoopWatch/WatchTokens.swift
      - path: Watch2WhoopWatch/WatchDialText.swift
    info:
      path: Watch2WhoopWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(W2W_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [zh-Hans, en]
        W2WAppGroup: $(W2W_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Watch2WhoopWatchWidgets/Watch2WhoopWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(W2W_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(W2W_BUNDLE_ID).watchkitapp.widgets
        PRODUCT_NAME: Watch2WhoopWatchWidgets
        DEVELOPMENT_TEAM: $(W2W_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: $(W2W_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(W2W_BUILD_NUMBER)
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Watch2Whoop:
    build:
      targets:
        Watch2Whoop: all
        Watch2WhoopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - Watch2WhoopTests
    archive:
      config: Release
  Watch2WhoopWatch:
    build:
      targets:
        Watch2WhoopWatch: all
    run:
      config: Debug
    archive:
      config: Release
