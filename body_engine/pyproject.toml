[project]
name = "body-engine"
version = "0.1.0"
description = "Body management system: scores, journal, lab results, supplements, rules (multi-user)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "mcp>=1.20",
    "anthropic>=1.15.0",
    "openai>=3.33.0",
    "google-genai>=2.31.0",
    "cryptography>=50.0.2",
    "openbodyscore",
]

[project.scripts]
body-engine = "body_engine.cli:main"
body-engine-mcp = "body_engine.mcp_server:main"

[tool.uv.sources]
# the scoring algorithms (Apache-2.0), developed in this repository; the Docker build copies it in (Dockerfile)
openbodyscore = { path = "../packages/openbodyscore", editable = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/body_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
