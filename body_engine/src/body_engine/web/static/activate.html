<!doctype html>
<html lang="zh-CN" data-i18n-title="activate.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>激活 Watch2Whoop</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--surface:#f4f4f6;--text:#111113;--text-2:#6c6c73;--accent:#111113;--on-accent:#fff;--bad:#be5a44}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#1c1c1e;--text:#f5f5f7;--text-2:#a1a1a6;--accent:#f5f5f7;--on-accent:#000;--bad:#e07a62}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:420px;padding:32px 16px calc(32px + env(safe-area-inset-bottom))}
img{display:block;width:64px;height:64px;margin:0 0 20px;border-radius:14px}
h1{font-size:26px;line-height:1.2;margin:0 0 8px}
p{margin:0 0 24px;color:var(--text-2)}
input{display:block;width:100%;font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;padding:14px;margin:0 0 12px;border:0;border-radius:12px;background:var(--surface);color:var(--text)}
button{display:block;width:100%;font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.5}
.err{min-height:1.5em;margin:12px 0 0;color:var(--bad);font-size:15px}
button.secondary{margin-top:10px;background:var(--surface);color:var(--text)}
h2{font-size:20px;margin:28px 0 8px}
ol{margin:0 0 16px;padding-left:22px}li{margin:6px 0}
.small{font-size:14px;margin:14px 0 0}
.status{min-height:1.5em;margin:0 0 20px;color:var(--text-2)}
.help{display:block;margin:20px 0 0;padding:14px;border-radius:14px;background:var(--surface);color:var(--text);text-align:center;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1 data-i18n="activate.title">激活 Watch2Whoop</h1>
  <p id="hint" data-i18n="activate.hint">先在 TestFlight 装好 Watch2Whoop，再点下面的按钮</p>
  <!-- no code in the link: the person types it (activate.js shows the form only then) -->
  <form id="form" novalidate hidden>
    <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="激活码" aria-label="激活码" data-i18n-ph="activate.code" data-i18n-aria="activate.code">
    <button id="go" type="submit" data-i18n="activate.go">打开 App 完成设置</button>
  </form>
  <!-- code in the link: iPhone / iPad open the app (no web fallback; the install guide if it does not open),
       a computer signs in on the web; activate.js shows one button -->
  <div id="choose" hidden>
    <p id="status" class="status" role="status"></p>
    <button id="open-app" type="button" data-i18n="activate.openApp" hidden>在 App 里打开</button>
    <button id="open-web" type="button" data-i18n="activate.openWeb" hidden>在网页里打开</button>
  </div>
  <div id="err" class="err" role="alert"></div>
  <section id="install" class="guide" hidden>
    <h2 data-i18n="activate.installTitle">先安装 App</h2>
    <p data-i18n="activate.installLead">iPhone 上要用 Watch2Whoop App。装好以后再点一次这个激活链接。</p>
    <ol>
      <li data-i18n="activate.install1">在 App Store 安装 TestFlight</li>
      <li data-i18n="activate.install2">打开 TestFlight 邀请邮件，点「查看测试」→「接受」</li>
      <li data-i18n="activate.install3">在 TestFlight 里安装 Watch2Whoop</li>
      <li data-i18n="activate.install4">回到这里，再点一次激活链接</li>
    </ol>
    <a class="help" href="https://apps.apple.com/app/testflight/id899247664" target="_blank" rel="noopener" data-i18n="activate.getTestFlight">去 App Store 装 TestFlight</a>
    <p class="small" data-i18n="activate.noInvite">没收到邀请邮件？请管理员把你的 Apple ID 加为测试员</p>
  </section>

  <a class="help" href="handbook/" target="_blank" rel="noopener" data-i18n="activate.handbook">使用手册</a>
</main>
<script src="i18n.js"></script>
<script src="i18n-en.js"></script>
<script src="activate.js"></script>
</body>
</html>
