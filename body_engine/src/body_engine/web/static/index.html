<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="身体">
<meta name="referrer" content="no-referrer">
<meta name="application-name" content="body-engine-today">
<title>身体 · 今天</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ai.css">
<link rel="stylesheet" href="grocery.css">
<link rel="stylesheet" href="diet-profile.css">
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <div class="top-l" id="hdr-pick">
      <div class="top-date" id="hdr-date"></div>
      <h1 class="top-title" id="hdr-title">今天</h1>
    </div>
    <div class="top-r">
      <div class="daynav" id="daynav" hidden>
        <button id="day-prev" aria-label="前一天"><svg viewBox="0 0 16 16"><path d="M10 3.5L5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="day-next" aria-label="后一天"><svg viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <button id="who" class="avatar" aria-label="切换查看的人" hidden></button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

  <main id="view" class="view" tabindex="-1"></main>
  <button id="back-today" class="back-today" type="button" hidden>回到今天</button>

  <div class="dock">
    <a class="ask" id="ask" href="#" rel="noopener">
      <!-- Jarvis icon: "sparkles" from Tabler Icons (MIT, https://tabler.io/icons) -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Jarvis</span>
    </a>
    <nav class="tabbar" aria-label="页面">
      <button data-tab="today" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 4a8 8 0 0 1 7.7 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>今天</span></button>
      <button data-tab="trends" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l4.5-5 3.5 3 7-8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>趋势</span></button>
      <button data-tab="food" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5h16a8 8 0 0 1-16 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 4.5c0 1.5 1.5 1.5 1.5 3S9 9 9 10M14 4.5c0 1.5 1.5 1.5 1.5 3S14 9 14 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>饮食</span></button>
      <button data-tab="record" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>记录</span></button>
      <button data-tab="me" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 19.5c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>我</span></button>
    </nav>
  </div>
</div>

<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="off">
    <img src="icon.svg" alt="" width="60" height="60">
    <h1>身体管理</h1>
    <p>输入激活码（16 位）、登录码（12 位）或 token</p>
    <input id="token" class="input" name="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="激活码 / 登录码" aria-label="激活码、登录码或 token" required>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn">登录</button>
    <p class="login-error" id="login-error" role="alert"></p>
    <a class="login-app" id="login-app" href="watch2whoop://sync" hidden>手机同步与设置</a>
  </form>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="sheet-title"></h2>
      <button class="close" id="sheet-close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="ai-media.js" defer></script>
<script src="ai.js" defer></script>
<script src="profile.js" defer></script>
<script src="history.js" defer></script>
<script src="account.js" defer></script>
<script src="grocery.js" defer></script>
<script src="diet-profile.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
